            catch (e) { return false; }
        }
        // 按账号自动定默认配置,现在只对主账号生效(完整模式 + 刮胡)。其他新账号不再按邮箱自动设成极简,
        // 而是在引导里自己选「你想怎么用」(AUDIT-ux P0-1)。老账号的档案在云端,登录后原样回来,不受影响。
        function autoMatchProfile(uid) {
            PROFILE = lg(K.profile) || PROFILE;   // 云端档案可能刚落到本机,先读它(别拿内存里的旧档案判断、再写回去盖掉)
            if (!uid || PROFILE.autoMatched === uid) return false;
            if (!isOwnerAccount()) return false;
            Object.assign(PROFILE, { minimalMode: false, showJournal: true, shaving: true, hrt: false, seedShelf: true });
            PROFILE.autoMatched = uid;
            saveProfile();
            applyProfileVisibility(); syncSettingsUI();
            return true;
        }
        // 只清「未加账号前缀的旧照片」：新照片按 uid 隔离，换账号不该删别人的
        function clearAllPhotos(cb, _retried) {
            // _idb 常常还没初始化(唯一常规初始化点在 renderAll)，旧版直接 return 会静默跳过清理
            if (!_idb) { if (_retried) { if (cb) cb(); return; } initPhotoDB(() => clearAllPhotos(cb, true)); return; }
            try {
                const tx = _idb.transaction('photos', 'readwrite');
                const st = tx.objectStore('photos');
                const req = st.getAllKeys();
                req.onsuccess = () => (req.result || []).forEach(k => { if (String(k).indexOf('__') === -1) st.delete(k); });
                tx.oncomplete = () => { if (cb) cb(); };
                tx.onerror = () => { if (cb) cb(); };
            } catch (e) { if (cb) cb(); }
        }
        // 换账号时清掉上一个人的本地数据（localStorage 云键 + 排班模版 + 照片），防止两人串号
        function clearLocalUserData() {
            CLOUD_KEYS.forEach(k => localStorage.removeItem(k));
            if (typeof aiClearLocal === 'function') aiClearLocal();   // 顾问的本机缓存(对话 / 今日的话 / 开通状态)也是上一个人的
            localStorage.removeItem(K.preset);
            localStorage.removeItem('sk_lastpush');   // 推送时间戳属于上一个账号，留着会让新账号的云端被误判"不比本机新"
            clearAllPhotos();
            PROFILE = { shaving: false, hrt: false, skinType: '', name: '', onboarded: false, phase: 'repair', phaseStart: '' };
            try { localStorage.setItem(K.profile, JSON.stringify(PROFILE)); localStorage.setItem('__profile_owner_seeded__', '1'); } catch {}
            PD = loadPD(); PS = lg(K.prods) || {}; POPEN = lg(K.popen) || {};
            TN = initTN();   // 关键：内存里的「今晚洗澡/刮胡」也必须重置，否则上一个人的状态会串到新账号并被写回其排班
            localStorage.removeItem(K.preset);   // 排班模版不进云端，属于上一个人的，一并清
            applyProfileVisibility(); syncSettingsUI();
        }
        async function handleAuthChange(user) {
            _user = user; renderAuthBtn();
            if (typeof aiOnAuth === 'function') { try { aiOnAuth(user); } catch (e) { console.warn('ai auth', e); } }
            if (user) {
                const prevUid = localStorage.getItem(UIDK);
                if (prevUid && prevUid !== user.uid) {
                    // 真·换了人：先清上一个人的本地数据，再从新账号云端拉取
                    clearLocalUserData();
                    renderAll();
                    toast('换了账号，正在载入…');
                } else if (!prevUid) {
                    // 首次登录：本机可能存着**别人**在云同步之前攒下的数据(真实场景:Cici 在 Cait 机器上第一次登录)。
                    // 旧版直接跳过清理 → 上一个人的日志/产品/档案被并进新账号。这里按云端文档判断归属。
                    // 只在本机**真有记录**时才问(只是装了 App、点了几下设置不算),用自己的 sheet,不用原生 confirm(AUDIT-ux §3)
                    const hasLocal = (lg(K.jrnl) || []).some(e => e && ((e.status || []).length || (e.products || []).length || e.note));
                    if (hasLocal) {
                        let cloudExists = false;
                        try { const snap = await _db.collection('users').doc(user.uid).get(); cloudExists = snap.exists; } catch (e) {}
                        const mine = cloudExists ? false : await new Promise(res => openSheet({ id: 'claim', title: '这些记录是你的吗？', noClose: true,
                            text: '这台设备上有一些还没同步过的护肤记录。\n\n是你的：归到「' + (user.email || '这个账号') + '」名下，接着用。\n不是你的：清掉，载入你自己云端的数据。',
                            actions: [{ label: '不是我的', fn: () => res(false) }, { label: '是我的', primary: true, fn: () => res(true) }] }));
                        if (!mine) {
                            clearLocalUserData();
                            renderAll();
                        }
                    }
                }
                localStorage.setItem(UIDK, user.uid);
                // autoMatchProfile 挪到云端快照回来之后再跑(setupRealtimeSync 里):在这里跑会先写一份本机档案、
                // 排上推送,快照一到就走「本机有改动先上传」把云端的真档案盖掉(换新手机登录时)。
                setupRealtimeSync();
            } else {
                // 登出保留本地缓存供离线使用；不清数据。换成别的账号登录时才清。
                if (_unsub) { _unsub(); _unsub = null; }
            }
        }

        function renderAll() {
            invalidatePlanCache();
            PROFILE = lg(K.profile) || PROFILE;
            TN = initTN();
            applyProfileVisibility();
            syncSettingsUI();
            GONE = lg(K.gone) || GONE; EMPTIES = lg(K.empty) || EMPTIES; LOW = lg(K.low) || LOW;
            PD = loadPD(); PS = lg(K.prods) || PS; POPEN = lg(K.popen) || POPEN;
            applyShelfMigrations();
            sanitizePS();
            syncRegimen();
            initPhotoDB(() => { const sk = document.getElementById('skin'); if (sk && sk.classList.contains('active')) renderJrnl(); });
            renderProds(); renderTn();
            const sk = document.getElementById('skin'); if (sk && sk.classList.contains('active')) renderSkin();
            // 老账号的云端档案刚落地 → 引导不该再挂着(换手机先打开、后登录的情况)
            if (_oobe && !_oobe.redo && hasLegacyData() && PROFILE.seedShelf !== false) { closeSheet('oobe'); _oobe = null; }
        }

        // 云端数据落地后的重绘:期间的自动写盘只落本机、不反弹(见文件顶部 _applyingCloud 那段注释)
        function applyCloudThenRender() {
            _applyingCloud = true;
            try { renderAll(); } finally { _applyingCloud = false; }
        }
        function setupRealtimeSync() {
            if (!_db || !_user) return;
            if (_unsub) _unsub();
            _unsub = _db.collection('users').doc(_user.uid).onSnapshot(doc => {
                let isInit = !_unsub.initialized; _unsub.initialized = true;
                // 全新的云端账号:不论什么模式都进引导,在引导里自己选「怎么用」(不再按邮箱定;AUDIT-ux P0-1)
                if (!doc.exists) { if (isInit) { if (_user) autoMatchProfile(_user.uid); if (_oobe) { if (_oobe.step === 'welcome') { const go = () => oobeNext(); (typeof aiProbe === 'function' ? aiProbe(true) : Promise.resolve()).then(go, go); } } else if (needsOOBE()) startOOBE({}); } return; }
                if (doc.metadata && doc.metadata.hasPendingWrites) return;   // 这是本机自己刚写的回声，别拿它覆盖自己
                const cloudDoc = doc.data() || {};
                // 版本判断：云端比本机最后一次成功推送更旧 → 说明本地有还没推上去的新改动，
                // 不能让旧云覆盖(这正是"改动没推成→下次打开被旧云盖掉"的丢数据主因),反过来把本地推上去。
                const cloudAt = Number(cloudDoc._updatedAt || 0);
                const lastPush = Number(localStorage.getItem('sk_lastpush') || 0);
                // 🔴 本机还有没推上去的改动 ⇒ 先上传,绝不接受覆盖。
                // 只靠下面的 cloudAt<=lastPush 挡不住这一种:用户刚改完(2 秒防抖还没推出去),
                // 而云端此刻恰好比 lastPush 新(另一台设备刚推过)→ 直接走"全盘应用云端",
                // 刚改的那几下就没了。这正是"本地被无限覆盖"里**真会丢用户数据**的那一半。
                if (_pushTimer || _pushing || _pushDirty) {
                    showSyncStatus('↑ 本机有改动还没上传，先上传…', 'syncing');
                    if (!_pushing) { clearTimeout(_pushTimer); _pushTimer = setTimeout(pushToCloud, 200); }
                    return;
                }
                // 注意是 <= 不是 <（丢记录事故根因）：手机 PWA 上"最后几下勾选"常因 2 秒防抖没推完就被切后台,
                // 下次冷启动时 cloudAt 恰好等于上次成功推送的时间戳,旧版 < 判断放行,旧云把昨晚的记录整个抹掉。
                // 云端不比本机上次推送新 ⇒ 本机任何差异都只可能是还没推上去的新改动,应该上传,绝不能下载覆盖。
                if (lastPush && cloudAt && cloudAt <= lastPush) {
                    let dirty = false, pulled = false;
                    CLOUD_KEYS.forEach(k => {
                        const localV = localStorage.getItem(k);
                        if (localV === null) {
                            // 本机缺、云端有 → 补拉。没有这条,换账号/自己刚推送过之后,
                            // 时间戳相等会拦住整个应用云端的分支,新账号的日志/产品永远载入不了。
                            if (k in cloudDoc) { try { localStorage.setItem(k, JSON.stringify(cloudDoc[k])); pulled = true; } catch {} }
                            return;
                        }
                        if (!(k in cloudDoc)) { dirty = true; return; }   // 本机有、云端缺 → 该上传
                        let lv; try { lv = JSON.parse(localV); } catch { lv = localV; }
                        // 键序无关比较：Firestore 回来的 map 键序和本地 JSON 不同，比原串会永远"脏"→无限互推
                        if (_stableStr(lv) !== _stableStr(cloudDoc[k])) dirty = true;
                    });
                    if (pulled) { if (_user) autoMatchProfile(_user.uid); applyCloudThenRender(); }
                    if (dirty) {
                        showSyncStatus('↑ 本机数据较新，正在上传…', 'syncing');
                        clearTimeout(_pushTimer); _pushTimer = setTimeout(pushToCloud, 200);
                    } else if (pulled) showSyncStatus('已从云端更新');
                    else if (isInit) showSyncStatus('✓ 云端已连接');
                    return;
                }
                let changed = false;
                Object.entries(cloudDoc).forEach(([k, v]) => {
                    if (k === '_updatedAt') return;
                    const localV = localStorage.getItem(k);
                    let cloudVal = v;
                    // 排班表要逐日合并：本地已成为"过去"的日子保留本地值。
                    // 否则另一台设备（时区/日期不同）推上来的整份 K.wk 会改写这边界面上标着"不可更改"的历史。
                    if (k === K.wk && v && typeof v === 'object') {
                        const localWk = lg(K.wk) || {};
                        const merged = JSON.parse(JSON.stringify(v));
                        const t = today();
                        Object.keys(localWk).forEach(wkKey => {
                            const lw = localWk[wkKey]; if (!lw) return;
                            if (!merged[wkKey]) merged[wkKey] = { shower: Array(7).fill(false), shave: Array(7).fill(false) };
                            for (let i = 0; i < 7; i++) {
                                const mon = new Date(wkKey.slice(0, 4) + '-01-04T12:00:00');
                                mon.setDate(mon.getDate() + (Number(wkKey.slice(6)) - 1) * 7 - ((mon.getDay() + 6) % 7) + i);
                                if (localD(mon) < t) {
                                    merged[wkKey].shower[i] = !!(lw.shower || [])[i];
                                    merged[wkKey].shave[i]  = !!(lw.shave  || [])[i];
                                }
                            }
                        });
                        cloudVal = merged;
                    }
                    const cloudV = JSON.stringify(cloudVal);
                    if (localV !== cloudV) {
                        try { localStorage.setItem(k, cloudV); changed = true; } catch {}
                    }
                });
                if (changed) { if (_user) autoMatchProfile(_user.uid); applyCloudThenRender(); showSyncStatus('已从云端更新'); }
                else if (isInit) { showSyncStatus('✓ 云端已连接'); }
            }, e => console.warn('监听云端数据失败:', e));
        }

        function schedulePush() {
            if (!_db || !_user) return;
            clearTimeout(_pushTimer);
            _pushTimer = setTimeout(pushToCloud, 2000);
        }

        // 推送失败:指数退避(4s → 8s → … 最多 1 分钟),恢复网络(online 事件)立刻补推。
        // 旧版的 finally 看到 _pushDirty 又排了 1.5 秒,把 catch 里的退避覆盖掉 → 离线时每十几秒弹一次错误(AUDIT-ux P1-15)。
        let _pushBackoff = 0;
        async function pushToCloud() {
            if (!_db || !_user) return;
            _pushTimer = null;
            if (_pushing) { _pushDirty = true; return; }
            _pushing = true; _pushDirty = false;
            const data = {};
            CLOUD_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v !== null) { try { data[k] = JSON.parse(v); } catch { data[k] = v; } } });
            data._updatedAt = Date.now();
            let failed = false;
            try {
                await Promise.race([
                    _db.collection('users').doc(_user.uid).set(data, { merge: true }),
                    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000))
                ]);
                try { localStorage.setItem('sk_lastpush', String(data._updatedAt)); } catch {}
                _pushBackoff = 0;
                showSyncStatus('已同步', 'ok');
            } catch (e) {
                failed = true;
                console.warn('上传失败:', e);
                showSyncStatus('离线 · 改动先存在本机', 'err');
                _pushDirty = true;
                _pushBackoff = Math.min(60000, _pushBackoff ? _pushBackoff * 2 : 4000);
                clearTimeout(_pushTimer); _pushTimer = setTimeout(pushToCloud, _pushBackoff);
            } finally {
                _pushing = false;
                if (_pushDirty && !failed) { clearTimeout(_pushTimer); _pushTimer = setTimeout(pushToCloud, 1500); }
            }
        }
        window.addEventListener('online', () => { if (_db && _user) pushToCloud(); });

        let _syncFadeTimer = null, _syncState = 'ok';
        // 同步状态不再弹吐司(旧版每点一下弹一次「已保存」):离线时头部挂一个安静的小标,设置里显示上次同步时间
        function showSyncStatus(msg, state) {
            state = state || 'ok';
            if (state !== 'syncing') _syncState = state;
            const b = document.getElementById('net-badge');
            if (b) b.hidden = !(state === 'err' || (typeof navigator !== 'undefined' && navigator.onLine === false && _user));
            const sl = document.getElementById('sync-line'); if (sl) sl.textContent = syncLineText();
        }

        function signInGoogle() {
            if (typeof firebase === 'undefined') { sysAlert('登录服务没加载出来，检查一下网络再试。'); return; }
            firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => sysAlert('登录没成功。Safari 可能拦了弹窗：允许弹窗后再试，或者换电脑登录。\n\n' + e.message));
        }
        function signOut() { sysConfirm('退出登录？退出后用这台设备上的数据。', () => firebase.auth().signOut(), { ok: '退出' }); }
        function renderAuthBtn() {
            const el = document.getElementById('auth-btn'); if (!el) return;
            if (_user) {
                const name = _user.displayName ? _user.displayName.split(' ')[0] : '已登录';
                el.innerHTML = `<div class="set-row"><span>${esc(name)}${_user.email ? '<span class="muted small"> · ' + esc(_user.email) + '</span>' : ''}</span><button class="btn" onclick="signOut()">退出登录</button></div>`;
            } else {
                el.innerHTML = `<button class="btn btn-primary btn-block" onclick="signInGoogle()">用 Google 登录（换手机数据还在）</button>`;
            }
            const sl = document.getElementById('sync-line'); if (sl) sl.textContent = syncLineText();
        }

        applyProfileVisibility();
        syncSettingsUI();
        initFirebase();
        // 新用户引导 / 老用户的新版导览:等 Firebase 认出是谁再决定(已登录的老账号不该先看到引导)
        setTimeout(function () { if (!_user) maybeShowOnboarding(); }, 1800);

        // Global Haptic Feedback
        document.addEventListener('click', function(e) {
            const clickable = e.target.closest('button, .tn-step, .tag, .chip, .sc2, .day-block, .ph-bt, .tmr-btn, .modal-close');
            if (clickable && navigator.vibrate) {
                navigator.vibrate(10);
            }
        });
        
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('ServiceWorker registration successful');
                }).catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
