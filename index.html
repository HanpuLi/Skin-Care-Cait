            navigator.clipboard.writeText(txt).then(() => { if (b) { b.textContent = '复制好了'; setTimeout(() => { b.textContent = '复制购物清单'; }, 2000); } }).catch(() => sysAlert(txt));
        }

        // 已废弃：早期用来更新写死的 Cait 静态步骤（对应 DOM id 均已不存在，恒为空操作）。留空桩，免改所有调用点。
        // HRT 激素波动判断：单一来源；对关闭 HRT 的用户直接短路（无副作用，且防未来手工造 phase 数据误触发）
        function isHrtFluctuation(phase) {
            if (!PROFILE.hrt) return false;
            const ph = phase || '';
            return ph.includes('波动') || ph.includes('调整') || ph.includes('加量') || ph.includes('减量') || ph.includes('出血');
        }


        // ══ 皮肤评估 v3:「没有损伤信号 = 健康」(2026-10-29 推翻重做) ═══════════════════
        // 旧版以 60 分为底、只有勾「稳定/好转」才往上加、出油 -2。一个混油皮、诚实勾「出油+闭口」、从不勾「稳定」的人
        // 永远 53–60 → 落在 45–64「谨慎」区 → 酸被锁 1 次/周、视黄醇永远关(Cait 被锁在「维稳」半年,B1.5 查实)。
        // 体质(出油/闭口)不是屏障损伤;它压低屏障分、屏障分又卡住治闭口的酸 = 想治的症状在压制治它的手段。
        // 现在:每个标签只扣它真正伤到的那条轴。出油只扣「控油」、闭口只扣「清透」,都不碰屏障;没记坏信号 = 100。
        // 🔴 这些分**只用来描述**(徽章 / 评估卡 / 给顾问的快照),不再直接卡酸频率:
        //    酸频率由方案定(顾问方案,或离线阶梯 acidLadder),危险情况由 safetyGate() 按**硬事实**拦。
        const AX_PENALTY = {
            '变差': { barrier: 30, calm: 25, congestion: 10 },
            '泛红': { barrier: 25, calm: 25 },
            '敏感': { barrier: 20, calm: 10 },
            '干燥': { barrier: 15 },
            '爆痘': { calm: 25, congestion: 10 },
            '出油': { oil: 30 },
            '闭口': { congestion: 30 },
            '粗糙': { congestion: 15 }
        };
        const AX_RELIEF = 10;        // 记了「比昨天好」:当天每条轴少扣 10
        const SCORE_PRIOR = 80;      // 记录不足 3 天时向 80 收敛:没数据 ≠ 有问题,也 ≠ 完美
        const SCORE_FULL_N = 3;
        const IRRITATION_TAGS = ['泛红', '敏感', '爆痘', '变差'];
        function dayAxisScore(key, e) {
            const st = (e && e.status) || [];
            const ps = st.map(t => (AX_PENALTY[t] || {})[key] || 0).filter(x => x > 0).sort((a, b) => b - a);
            let pen = 0;
            ps.forEach((p, i) => { pen += i === 0 ? p : p * 0.5; });   // 同一天几个标签:最重的全额,其余减半
            if (st.indexOf('好转') >= 0) pen = Math.max(0, pen - AX_RELIEF);
            return Math.max(0, 100 - pen);
        }
        function axisScore(key, entries) {
            // 只吃记了皮肤状态的条目:只传照片 / 只写备注 / 极简模式推定的空条目不进分母
            entries = (entries || []).filter(e => e && (e.status || []).length);
            if (!entries.length) return null;
            const raw = entries.reduce((s, e) => s + dayAxisScore(key, e), 0) / entries.length;
            const conf = Math.min(1, entries.length / SCORE_FULL_N);
            return Math.max(0, Math.min(100, Math.round(SCORE_PRIOR + (raw - SCORE_PRIOR) * conf)));
        }
        function calcScore(entries) { return axisScore('barrier', entries); }
        function barrierScore() { return calcScore(jrnlLastNDays(7)); }
        // 窗口内实际有几天记了状态 —— 界面上标置信度用
        function barrierSampleN() { return jrnlLastNDays(7).filter(e => (e.status || []).length).length; }
        function barrierLabel(s) {
            if (s >= 85) return { label: '屏障优秀', cls: 'great' };
            if (s >= 65) return { label: '状态良好', cls: 'good' };
            if (s >= 45) return { label: '需要注意', cls: 'caution' };
            return { label: '重点修护', cls: 'repair' };
        }

        const AXES = [
            { key: 'barrier',    name: '屏障' },
            { key: 'oil',        name: '控油' },
            { key: 'congestion', name: '清透' },
            { key: 'calm',       name: '无炎' }
        ];
        // 趋势:方向只认**明确的变化信号**(比昨天好 / 比昨天差),不拿状态标签的多寡去猜。
        // 她每天记「有痘」是说"痘还在",不是"今天又新爆了";少勾一个标签不等于好转(8/20 真实事故:就医红线被吞)。
        function axisTrend(key) {
            const recent = jrnlLastNDays(4);
            if (!recent.length) return { dir: 'flat', delta: 0, enough: false };
            const better = recent.filter(e => (e.status || []).includes('好转')).length;
            const worse  = recent.filter(e => (e.status || []).includes('变差')).length;
            if (better || worse) {
                const d = (better - worse) * 8;
                return { dir: d >= 6 ? 'up' : d <= -6 ? 'down' : 'flat', delta: d, enough: true };
            }
            // 没有明确变化信号:看这条轴的扣分标签是消失了(好转)还是新出现了(变差)
            const neg = es => es.some(e => (e.status || []).some(t => ((AX_PENALTY[t] || {})[key] || 0) > 0));
            const nowBad = neg(jrnlLastNDays(2));
            const wasBad = neg((lg(K.jrnl) || []).filter(x => x && x.date && x.date >= offsetDate(-6) && x.date <= offsetDate(-3)));
            if (wasBad && !nowBad) return { dir: 'up', delta: 8, enough: true };
            if (!wasBad && nowBad) return { dir: 'down', delta: -8, enough: true };
            return { dir: 'flat', delta: 0, enough: recent.length >= 2 };
        }
        function trendArrow(t) { return t.dir === 'up' ? '升' : t.dir === 'down' ? '降' : '平'; }
        function assessSkin() {
            const e7 = jrnlLastNDays(7);
            const axes = AXES.map(a => ({ ...a, score: axisScore(a.key, e7), trend: axisTrend(a.key) }));
            const scored = axes.filter(a => a.score !== null);
            const overall = scored.length ? Math.round(scored.reduce((s, a) => s + a.score, 0) / scored.length) : null;
            return { axes, overall, sampleN: e7.filter(e => (e.status || []).length).length, recs: buildRecs(axes, overall) };
        }
        // 诉求 → 针对性建议
        const CONCERN_ADVICE = {
            '闭口/粉刺': '闭口靠「温和疏通 + 别搓脸」：温和酸按节奏一档档往上加，磨砂和厚重面霜先放一边。',
            '毛孔粗大': '毛孔改善慢，重点是清洁到位 + 控油 + 长期防晒，别指望短期见效。',
            '出油/T区': 'T区出油：清洁别过度（越剥越油），保湿选无油质地，防晒也挑清爽的。',
            '泛红/敏感': '泛红期做减法：停掉多余活性物，只留清洁 + 保湿 + 修护，等稳定再加回来。',
            '干燥/紧绷': '干燥优先补水锁水，刷酸别加频，洗脸水温别高。',
            '痘痘/炎症': '有炎症时别叠猛料；成片或久不消要考虑就医，不是靠加产品解决。',
            '暗沉/痘印': '痘印主要靠防晒 + 时间，防晒不到位再多美白也白搭。'
        };
        // 规则化行动建议(含就医红线),按优先级排序,最多 5 条
        function buildRecs(axes, overall) {
            const recs = [];
            const ax = k => axes.find(a => a.key === k) || {};
            const zs = userZones();
            if (zs.length) {
                const z = zs[0];
                recs.push({ level: 'info', text: `${z.name}：${z.care || '避开刺激性成分'}${(z.avoid || []).length ? '（该区不用' + (z.avoid || []).map(a => ({ acid: '酸类', mask: '面膜/磨砂', retinol: '视黄醇', scrub: '磨砂' })[a] || a).join('、') + '）' : ''}` });
            }
            const goalConcern = PROFILE.goal && PROFILE.goal.concern;
            if (goalConcern && CONCERN_ADVICE[goalConcern]) recs.push({ level: 'info', text: CONCERN_ADVICE[goalConcern] });
            // 就医红线只看硬事实:近 14 天炎症天数 + 最近 3 天仍在发炎(趋势可能误判,不能挂在推断量上)
            const g = safetyGate();
            if (g.medical) recs.push({ level: 'safety', text: g.medicalText });
            if (g.irritated) recs.push({ level: 'warn', text: g.acidCapMax === 0
                ? `近 3 天记了${g.tags.join('/')}${g.worsening ? '，还记了「比昨天差」' : '，而且是刷酸后两天内出现的'}：酸先停，猛酸/磨砂/泥膜/视黄醇都不上，只做清洁 + 保湿 + 修护。`
                : `近 3 天记了${g.tags.join('/')}：猛酸、磨砂、泥膜、视黄醇先不上；温和酸最多每周 1 次（避开发红处）。` });
            const barrier = ax('barrier').score, cong = ax('congestion').score, oil = ax('oil').score;
            if (barrier !== null && barrier < 45) recs.push({ level: 'warn', text: '屏障分低：以修护为主，洗完全脸要有东西护着，别为了控油把脸洗干。' });
            if (cong !== null && cong < 60 && !g.irritated) recs.push({ level: 'info', text: `闭口/粗糙偏多：温和酸按节奏走（现在每周 ${maxAcidPerWeek()} 次），没刺激就会一档档往上加；别上磨砂搓脸。` });
            if (oil !== null && oil < 60) recs.push({ level: 'info', text: 'T区出油：控油但别过度清洁（越剥越油），防晒选无油款。' });
            if (!recs.filter(r => r.level !== 'info').length && overall !== null && overall >= 80) recs.push({ level: 'good', text: '没有损伤信号，保持当前节奏。' });
            if (jrnlLastNDays(7).filter(e => (e.status || []).length).length < 2) recs.push({ level: 'info', text: '多记几天皮肤状态，评估会更准。' });
            const order = { safety: 0, warn: 1, info: 2, good: 3 };
            recs.sort((a, b) => (order[a.level] ?? 9) - (order[b.level] ?? 9));
            return recs.slice(0, 5);
        }

        // ══ 安全闸:唯一红线 —— 顾问方案、离线阶梯、今晚的小改,上脸之前都过这一道 ══════════════
        // 只拦真危险的,只看**硬事实**(最近几天记了什么、HRT 记录、货架上真有什么),不看推断出来的分数。
        //   ① 近 3 天记了 泛红/敏感/爆痘/变差 → 猛酸、磨砂、泥膜、视黄醇不上;温和酸最多 1 次/周
        //      (「持续但没恶化」保留 1 次/周维持量是 8/20 定的:主诉闭口的人停光去角质只会被永久锁死)
        //      记了「比昨天差」、或刺激出现在刷酸后两天内 → 酸也停(0)
        //   ② 近两周有炎症 → 猛酸不上;近两周有炎症或闷闭口 → 磨砂不上(8/26 的配套闸门,保留)
        //   ③ HRT 波动/爆发期(只看本人开了 HRT 的记录)→ 酸 ≤1 次/周、停面油、不上猛酸和视黄醇
        //   ④ 只排产品库里真有、没被标「我不用」的 —— 见 gateBlocks()
        //   ⑤ 分区避开项(zones)永远生效,顾问只能加不能减 —— 见 zonesAvoiding()
        // 最近一次刷酸后 48 小时内(当天 / 次日 / 第三天)记到刺激 —— 这次酸很可能就是诱因
        // 某支产品现在能不能上脸:null = 可以;否则返回原因(界面上原样告诉她为什么没生效)
        // ── 两条口径写成常量,一行就能改(Cait 2026-10-29 已拍板)──
        // 就医红线亮着:所有酸都停(包括杏仁酸 / 乳酸这类温和酸),今晚只排清洁 + 保湿 + 修护;点「看过了」才解除
        const MEDICAL_STOPS_ALL_ACID = true;
        // 极简模式的记录:'optional' = 默认全做 + 例外点一下 + 皮肤状态想记就记、从不催;'none' = 完全不显示记录入口
        const MINIMAL_LOGGING = 'optional';
        let _gateMemo = { key: null, val: null };
        function _gateKey() { return today() + '|' + (localStorage.getItem(K.jrnl) || '') + '|' + (PROFILE.hrt ? 1 : 0) + '|' + getExfoliantTags().join(',') + '|' + JSON.stringify(PROFILE.medical || null) + '|' + (PROFILE.oobeAt || ''); }
        function _statusDays(days, tags) { return jrnlLastNDays(days).filter(e => (e.status || []).some(s => tags.indexOf(s) >= 0)); }
        // 最近一次刷酸后 48 小时内(当天 / 次日 / 第三天)记到刺激 —— 这次酸很可能就是诱因
        function acidReactedRecently() {
            const tags = getAcidTags();
            const recent = jrnlLastNDays(3);
            const used = recent.filter(e => (e.products || []).some(p => tags.includes(p))).map(e => e.date).sort();
            if (!used.length) return false;
            const first = used[0];
            return recent.some(e => e.date >= first && (e.status || []).some(s => IRRITATION_TAGS.indexOf(s) >= 0));
        }
        // 就医红线只看硬事实:近 14 天泛红/新痘 ≥5 天、而且最近 3 天还在。点了「看过了」之后只数那天以后的
        function medicalRedLine() {
            const m = PROFILE.medical || {};
            const since = (m.state === 'seen' && m.seenAt) ? m.seenAt : '';
            const inflam = jrnlLastNDays(14).filter(e => e.date > since && (e.status || []).some(s => s === '泛红' || s === '爆痘'));
            const still = inflam.some(e => e.date >= offsetDate(-2));
            return { on: inflam.length >= 5 && still, days: inflam.length };
        }
        function safetyGate() {
            const key = _gateKey();
            if (_gateMemo.key === key) return _gateMemo.val;
            const irr3 = _statusDays(3, IRRITATION_TAGS);
            const tags = [];
            irr3.forEach(e => (e.status || []).forEach(s => { if (IRRITATION_TAGS.indexOf(s) >= 0 && tags.indexOf(s) < 0) tags.push(s); }));
            const irritated = irr3.length > 0;
            const worsening = _statusDays(4, ['变差']).length > 0;
            const react = irritated && acidReactedRecently();
            const inflamed14 = _statusDays(14, ['泛红', '敏感', '爆痘']).length > 0;
            const clogged14 = _statusDays(14, ['闭口']).length > 0;
            const hrtFlare = !!PROFILE.hrt && jrnlLastNDays(5).some(x => isHrtFluctuation(x.phase));
            const red = medicalRedLine();
            const medical = red.on;
            const firstNight = !!PROFILE.oobeAt && PROFILE.oobeAt === today();
            let acidCapMax = 7;
            const notes = [];
            if (medical && MEDICAL_STOPS_ALL_ACID) { acidCapMax = 0; notes.push('就医提醒亮着 → 所有酸先停，看过医生点「看过了」才解除'); }
            if (firstNight) { acidCapMax = 0; notes.push('第一晚 → 先不上任何活性'); }
            if (irritated) {
                const cap = (worsening || react) ? 0 : 1;
                acidCapMax = Math.min(acidCapMax, cap);
                notes.push(cap === 0
                    ? `近 3 天有${tags.map(tagLabel).join('、')}${worsening ? '，还记了「差些」' : '，出现在刷酸后两天内'} → 酸先停`
                    : `近 3 天有${tags.map(tagLabel).join('、')} → 温和酸最多每周 1 次，猛酸 / 磨砂 / 泥膜 / 维 A 不上`);
            }
            if (hrtFlare) { acidCapMax = Math.min(acidCapMax, 1); notes.push('HRT 波动期 → 酸最多每周 1 次、面油先停'); }
            const val = {
                irritated, tags, worsening, react, inflamed14, clogged14, hrtFlare, medical, firstNight, acidCapMax, notes,
                medicalText: `近两周有 ${red.days} 天泛红或新痘，最近还在。要是集中在嘴周、鼻下，可能是口周皮炎，越刷酸越糟，这种要医生看。`,
                banStrong: irritated || inflamed14 || hrtFlare || medical || firstNight,
                banScrub: irritated || inflamed14 || clogged14 || medical || firstNight,
                banRetinol: irritated || hrtFlare || medical || firstNight,
                banMask: irritated || medical || firstNight,
                banOil: hrtFlare
            };
            _gateMemo = { key, val };
            return val;
        }
        // 某支产品现在能不能上脸:null = 可以;否则返回原因(界面上原样告诉她为什么没生效)
        function gateBlocks(p, g) {
            g = g || safetyGate();
            if (!p) return '产品库里没有这支';
            if (p.hidden || isGone(p.id)) return '家里已经没有这支了';
            if ((PROFILE.excluded || []).includes(p.id)) return '你标了不要了';
            const type = (p.schedule && p.schedule.type) || '';
            const why = g.medical ? '就医提醒亮着' : g.firstNight ? '第一晚' : (g.tags.length ? '近 3 天有' + g.tags.map(tagLabel).join('、') : '');
            if (hasTrait(p, 'scrub')) {
                if (g.banScrub) return (why || (g.inflamed14 ? '近两周有泛红 / 新痘' : '近两周在闷闭口')) + ' → 磨砂不上';
            } else if (hasTrait(p, 'strong-exfo')) {
                if (g.banStrong) return (why || (g.hrtFlare ? 'HRT 波动期' : '近两周有泛红 / 新痘')) + ' → 猛酸不上';
            }
            if (g.banRetinol && (p.role === 'retinol' || type === 'retinol')) return (why || 'HRT 波动期') + ' → 维 A 先停';
            if (g.banMask && (p.role === 'mask' || type === 'mask' || hasTrait(p, 'clay'))) return why + ' → 泥膜 / 去角质面膜先停';
            if (g.banOil && p.role === 'oil') return 'HRT 波动期 → 面油先停';
            if (g.acidCapMax === 0 && (p.role === 'acid' || type === 'acid'))
                return g.medical ? '就医提醒亮着 → 所有酸先停' : g.firstNight ? '第一晚 → 先不上活性' : g.worsening ? '记了「差些」→ 酸先停' : '刷酸后两天内记到刺激 → 酸先停';
            return null;
        }

        // ══ 离线兜底:按真实反应爬坡的刷酸阶梯 ══════════════════════════════════
        // 只在**没有顾问方案**时生效(不在白名单 / 后端连不上 / 离线)。从 1 次/周温和酸起步:
        //   完整模式:刷酸后 48 小时内(当天/次日/第三天)**记了状态而且没有**泛红/敏感/爆痘/变差 = 一次「干净」;
        //            连续 3 次干净 → 升一档,封顶 3 次/周;一记到刺激 → 降一档(最低 1,当晚停不停交给安全闸);
        //            那几天什么状态都没记 = 不算数(不升不降)—— 没数据不是证据;两次刷酸隔了 3 周以上 → 降一档(耐受会退)。
        //   🔴 极简模式:她不记录,排上的酸会被推定「用了」(absorbPrescribedHistory)。「没记到刺激」在这里**不是**耐受的证据,
        //      把它当耐受自动加量,就是 8/15 连排三晚酸的老路。所以极简模式**从不自动升档**:停在她手动设的档(默认 1),
        //      只在记到刺激时降;要升只能由顾问(看她偶尔的对话/照片)或她自己在「我」里改。
        const LADDER_MAX = 3, LADDER_STEP_N = 3, LADDER_WINDOW = 60, LADDER_GAP_RESET = 21;
        let _ladderMemo = { key: null, val: null };
        function _addDays(ds, n) { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return localD(d); }
        function acidLadder() {
            const manual = [1, 2, 3].indexOf(+PROFILE.acidLevel) >= 0 ? +PROFILE.acidLevel : null;
            const minimal = !!PROFILE.minimalMode;
            const key = _gateKey() + '|' + manual + '|' + (PROFILE.acidLevelAt || '') + '|' + (minimal ? 1 : 0);

        const ROLE_CAPS = {

        function ownedOfRole(role) {

        const TRAIT_DEFS = [

            if (/膏|baume|balm|凡士林|petrolatum|乳木果|shea|厚重|rich|封闭/i.test(s)) t.push('occlusive');
            if (/精油|essential oil|玫瑰|香氛|香精|parfum|fragrance/i.test(s)) t.push('fragranced');
            if (/面油|精华油|\boil\b/i.test(s)) t.push('oil-based');
            if (/无油|oil.?free|轻薄|清爽|light|gel|啫喱|lotion|乳液/i.test(s)) t.push('light');
            return t;
        }
        function hasTrait(p, t) { return traitsOf(p).indexOf(t) >= 0; }
        // 家里有的 / 现在排进流程的
        function shelfProducts()  { return PD.filter(p => !p.hidden && !isExcluded(p)); }
        function activeProducts() { return shelfProducts().filter(p => isSchedActive(p, PS[p.id] || p.statuses[0])); }
        function tagInDays(n, names) { return jrnlLastNDays(n).some(e => (e.status || []).some(x => names.indexOf(x) >= 0)); }
        // 全脸用的东西。眼霜/眼部精华再"舒缓"也顶不了全脸那一档 ——
        // 不加这一条,「轻薄的镇静」会被一支眼部精华糊弄过去,缺口就报不出来了(实测踩到)。
        // 新进货架的东西,前几晚别直接全脸怼 —— 先避开发红/破皮处,看两晚没加重再全上。
        // 正在发炎(疑口周皮炎)时尤其:把没用过的东西压在病灶上,真出事也分不清是谁干的。
        // 用产品定义里的 addedOn 判断,不依赖用户有没有填开封日期(填了才有 POPEN,新用户多半没填)。
        const INTRO_NIGHTS = 3;
        function introNightsLeft(p) {
            if (!p || !p.addedOn) return 0;
            const d = Math.floor((new Date(today() + 'T12:00:00') - new Date(p.addedOn + 'T12:00:00')) / 86400000);
            return (d >= 0 && d < INTRO_NIGHTS) ? (INTRO_NIGHTS - d) : 0;
        }
        function introHint(p) {
            const n = introNightsLeft(p); if (!n) return '';
            const zs = zonesAvoiding('acid');   // 她自己标过的敏感/红疹区,复用同一份,别让人再设一遍
            return '（新加的，还剩 ' + n + ' 晚试用期：先薄涂一层，' +
                   (zs.length ? '避开' + zs.join('、') : '避开正在发红/破皮的地方') +
                   '；没有刺痛或加重，再全脸用）';
        }
        function faceWide(p) { return p && p.role !== 'eye' && p.role !== 'spf' && p.role !== 'precleanse'; }
        // 冲洗掉的东西(洁面、冲洗型面膜)顶不了「洗完脸上有东西护着」—— 它根本没留在脸上。
        function leaveOn(p) { return p && ['cleanse', 'precleanse', 'mask', 'soothe'].indexOf(p.role) < 0; }
        // 🔴 今晚流程和"缺口判断"必须用**同一个**口径,否则会出现「流程里把它停了、缺口里却算它顶着」
        //    这种自相矛盾 —— 2026-08-28 实测就是这样:Toleriane 用完后,家里只剩含香精的 Rose de Vie
        //    和只点涂的 B5,晚上流程两件都不涂,缺口却报"洗完有东西护着 ✓",于是 App 说不用买,
        //    而 Cici 的晚间流程实际变成了「洗脸 + 眼霜 + 点涂」——洗完脸全脸什么都没有。
        function irritatedNow() { return jrnlLastNDays(3).some(e => (e.status || []).some(s => s === '泛红' || s === '敏感' || s === '爆痘')); }
        function calmDownMode() { return irritatedNow() || jrnlLastNDays(14).some(e => (e.status || []).indexOf('闭口') >= 0); }
        // 这支东西**今天到底会不会被涂上脸**?不会就返回"为什么不用",它也就顶不了任何一档。
        function blockedNow(p) {
            if (!p) return '家里没有这件东西';
            if (calmDownMode() && (hasTrait(p, 'fragranced') || hasTrait(p, 'oil-based')))
                return '含精油/香精，正在泛红或闷闭口时要停';
            return null;
        }
        // 只点涂的修护膏顶不了"全脸洗完有东西护着"那一档(点在痘上的东西护不了整张脸)
        function spotOnly(p) { return !!p && p.role === 'repair' && repairUse() === 'spot'; }

        // 🔴 要不要买新东西,**不按产品分类判断**(「舒缓类只剩一件了」这种没有意义),
        // 而是:照现在这张脸,一套能起作用的方案需要哪几件事?家里剩下的东西能不能把每件事办了?
        // 办不了的那一项才是"缺口",才需要买 —— 这是 Cait 2026-08-26 定的判断标准。
        function regimenNeeds() {
            const b = barrierScore();
            const needs = [
                { key: 'clean',   label: '把脸洗干净',        why: '每天都要洗脸,这一档不能空',
                  test: p => capsOf(p).indexOf('clean') >= 0 },
                // ⚠️ 不能只看"家里有没有这一类" —— 要看**今天会不会真涂上脸**:被停掉的、只点涂的、
                //    洗掉的,都顶不了这一档(见 blockedNow/spotOnly/leaveOn 上面那段注释)
                // ⚠️ 排酸的那一晚流程按设计会跳过精华(不在刚用完酸的脸上叠活性),
                //    所以"家里只有一支精华"的货架,在排酸那晚全脸是空的 —— 那晚恰恰最需要封层
                //    (AAD:去角质后立即保湿)。有排酸时,精华不算能顶这一档。
                { key: 'hydrate', label: '洗完脸上要有东西护着', why: '洗完什么都不涂,屏障只会更差',
                  test: p => faceWide(p) && leaveOn(p) && capsOf(p).indexOf('hydrate') >= 0
                             && !blockedNow(p) && !spotOnly(p)
                             && !(maxAcidPerWeek() > 0 && p.role === 'serum') },
                { key: 'spf',     label: '白天防晒',          why: '有炎症/用过酸之后不防晒 = 留印、更红',
                  test: p => capsOf(p).indexOf('spf') >= 0 }
            ];
            if (tagInDays(14, ['闭口', '粗糙']))
                needs.push({ key: 'gentle-exfo', label: '温和疏通(对付闭口)',
                    why: '近两周记了闭口/粗糙 —— 闭口只能靠温和疏通,搓(磨砂)和闷(厚霜)都只会更糟',
                    test: p => hasTrait(p, 'gentle-exfo') && !hasTrait(p, 'scrub') });
            if (tagInDays(14, ['泛红', '敏感', '爆痘']))
                needs.push({ key: 'calm-light', label: '轻薄的镇静',
                    why: '近两周有泛红/敏感/痘 —— 需要能镇静、又不闷不刺激的东西(封闭性膏体、精油类不算)',
                    test: p => faceWide(p) && hasTrait(p, 'calm') && !spotOnly(p) && !hasTrait(p, 'occlusive') && !hasTrait(p, 'oil-based') && !hasTrait(p, 'fragranced') });
            if (b !== null && b < 45)
                needs.push({ key: 'barrier', label: '修护屏障',
                    why: '屏障分 ' + b + ',在修护模式 —— 要有能修屏障的东西托底',
                    test: p => faceWide(p) && !blockedNow(p) && (hasTrait(p, 'calm') || p.role === 'repair') });
            if (tagInDays(7, ['干燥']))
                needs.push({ key: 'moisture', label: '锁水',
                    why: '近一周记了干燥 —— 要有保湿封层',
                    test: p => !blockedNow(p) && (p.role === 'moist' || p.role === 'repair' || p.role === 'oil') });
            return needs;
        }
        // 每一项需求 → 家里谁能办。一件都没有 = 缺口 = 该买了。
        function regimenCoverage() {
            const shelf = shelfProducts();
            return regimenNeeds().map(n => {
                const have = shelf.filter(n.test);
                return { key: n.key, label: n.label, why: n.why, have: have,
                         active: have.filter(p => isSchedActive(p, PS[p.id] || p.statuses[0])) };
            });
        }
        function regimenGaps() { return regimenCoverage().filter(c => !c.have.length); }
        // 缺口 → 买什么(说清挑选标准;具体型号在 SHOP_PICKS 里,是调研过的结论,不是随口推荐)
        const SHOP_ADVICE = {
            clean:        { what: '一支温和洁面', how: '氨基酸/无皂基、无香精,洗完不紧绷' },
            hydrate:      { what: '一支基础保湿', how: '油皮选无油乳液/fluid,干皮选面霜;无香精无精油,成分越简单越好' },
            spf:          { what: '一支防晒',     how: 'SPF30+、无油/清爽,敏感肌可选纯物理' },
            'gentle-exfo':{ what: '一支温和的酸', how: '杏仁酸/乳酸/PHA,浓度别高;不要磨砂、不要高浓度甘醇酸' },
            'calm-light': { what: '一支轻薄的镇静产品', how: '要点:质地是水/精华/凝胶(不是膏体)、无香精无精油、成分表短;泛醇/积雪草/神经酰胺/尿囊素这类修护成分' },
            barrier:      { what: '一支修护类产品', how: '神经酰胺/泛醇/积雪草;正在闷闭口就别选厚膏' },
            moisture:     { what: '一支保湿封层', how: '按肤质挑质地,别为了"滋润"选香精重的' }
        };
        // 调研过的具体推荐(英国可买)。留空 = 还没调研过,界面就只给挑选标准。
        // 2026-08-26 查过成分表的结论,不是随手推荐:
        const SHOP_PICKS = {
            // 2026-08-28(Toleriane Ultra Light 用完之后)查成分表定的,不是照名字挑。
            // Cait:「不需要买同款,买同品类最合适最好的」+「选最合适 Cici 肤质/需求的」。
            // → 按**她这张脸**(混油出油 + 连续泛红 + 闷闭口爆痘 + 在刷酸)选:要的不只是"不刺激",
            //   还得"能干活"。烟酰胺对**控皮脂、抗炎泛红、痤疮**三件事都有证据,这三件正好是她的三件。
            //   Avène Hydra-10 成分表更短(9 个、无防腐)但纯被动保湿 —— 只是不添乱,不解决问题 → 转备选。
            hydrate: { name: 'La Roche-Posay Toleriane Sensitive Fluide (40ml)', price: 'Boots £19.55（原 £23，LRP 促销中；2026-08-28 实查。Superdrug £22.99，Escentual 缺货）',
                why: '全表 10 个成分、无香精无精油无酒精，fluid 质地混油/油皮不闷；含烟酰胺 —— 控油、泛红、痘这三件正好是现在这张脸的问题。' },
            'hydrate+calm': { name: 'La Roche-Posay Toleriane Sensitive Fluide (40ml)', price: 'Boots £19.55（原 £23，LRP 促销中；2026-08-28 实查。Superdrug £22.99，Escentual 缺货）',
                why: '一支同时办两档：早晚全脸的保湿打底 + 「轻薄的镇静」。10 个成分、无香精无精油无酒精、fluid 不闷；' +
                     '烟酰胺对出油/泛红/痘都有据可依 —— 按肤质挑就是它。' +
                     '备选 Avène Tolérance Hydra-10 Fluid(£16–20，9 成分、无香精无防腐，成分表更短但没有活性，只是被动保湿；烟酰胺不耐受时换它)。' +
                     '别拿 Cicaplast B5 精华顶这一档：含 Isopropyl Myristate(偏致粉刺)和 Methyldihydrojasmonate(香料)，正在闷闭口时不合适。' +
                     '也别以为贵的更安全：SkinCeuticals Phyto Corrective Gel(约 £70)含 Parfum、桉树叶油、Linalool、Citronellol 和色素，会被同一条规则停掉。' },
            'calm-light': { name: 'Avène Tolérance Hydra-10 Hydrating Fluid (40ml)', price: '约 £16–20，Boots/Escentual',
                why: '全表只有 9 个成分、无香精无防腐(无菌泵)、质地是 fluid 不闷，油皮混油都能用。' +
                     '别买 Cicaplast B5 精华顶这一档：它含 Isopropyl Myristate(偏致粉刺)和 Methyldihydrojasmonate(香料)，正在闷闭口时不合适。' },
            'gentle-exfo': { name: 'Paula\'s Choice 6% 杏仁酸 + 2% 乳酸（家里这支就是）', price: '',
                why: '杏仁酸分子大、渗透慢、对微炎症最友好，是这类皮肤的首选；真要再买就买同类，别升级成甘醇酸。' }
        };

        // 一支产品能同时补上好几档时要合并成一条 —— 否则「缺保湿」+「缺镇静」会被读成"要买两支",
        // 而实际上一支无香精的轻薄保湿把两档都办了(2026-08-28 Toleriane 用完后就是这个情况)。
        const SHOP_MERGE = [
            { key: 'hydrate+calm', keys: ['hydrate', 'calm-light'],
              what: '一支轻薄的保湿（同一支就顶了「镇静」那一档）',
              how: '无香精无精油、质地是 fluid/乳液不是厚膏、非致粉刺；带烟酰胺/泛醇/神经酰胺这类修护成分更好' }
        ];
        // 购物清单唯一入口:缺口 → 合并 → 挑选标准 + 调研推荐。产品页和「复制购物清单」都走这里。
        function shopItems() {
            const gaps = regimenGaps(), keys = gaps.map(g => g.key), taken = {}, out = [];
            SHOP_MERGE.forEach(m => {
                if (!m.keys.every(k => keys.indexOf(k) >= 0)) return;
                m.keys.forEach(k => { taken[k] = 1; });
                out.push({ key: m.key, mergedKeys: m.keys, what: m.what, how: m.how,
                           why: gaps.filter(g => m.keys.indexOf(g.key) >= 0).map(g => g.why).join('；'),
                           pick: SHOP_PICKS[m.key] });
            });
            gaps.forEach(g => {
                if (taken[g.key]) return;
                const ad = SHOP_ADVICE[g.key] || {};
                out.push({ key: g.key, what: ad.what || g.label, how: ad.how, why: g.why, pick: SHOP_PICKS[g.key] });
            });
            // 「快用完了」的提前量:排在真缺口后面 —— 那些是现在就没有,这些是还够用几天。
            // 同样只在"它没了真会缺"时才提示买;有替补的不催(免得又变成按分类催货)。
            LOW.forEach(id => {
                const prod = PD.find(x => x.id === id); if (!prod) return;
                const ng = gapsIfGone(id);
                if (!ng.length) return;
                const nk = ng.map(g => g.key), used = {};
                const covered = k => out.some(o => o.key === k || o.key === 'soon:' + k ||
                                                   (o.mergedKeys || []).indexOf(k) >= 0);
                // ⚠️ 提前买的也必须走「一支顶两档」的合并,否则「快用完的是唯一的保湿」会同时报
                //    "缺保湿"+"缺镇静"两条,又变成让人以为要买两支(8/28 刚修过的老毛病)
                SHOP_MERGE.forEach(m => {
                    if (!m.keys.every(k => nk.indexOf(k) >= 0)) return;
                    m.keys.forEach(k => { used[k] = 1; });
                    if (covered(m.key)) return;
                    out.push({ key: 'soon:' + m.key, mergedKeys: m.keys, soon: true, prod: prod.name,
                               what: m.what + '（提前买：「' + prod.name + '」快用完了）', how: m.how,
                               why: '你标了「' + prod.name + '」快用完 —— 它一没，' +
                                    ng.filter(g => m.keys.indexOf(g.key) >= 0).map(g => g.label).join('、') + '就都断了',
                               pick: SHOP_PICKS[m.key] });
                });
                ng.forEach(g => {
                    if (used[g.key] || covered(g.key)) return;
                    const ad = SHOP_ADVICE[g.key] || {};
                    out.push({ key: 'soon:' + g.key, soon: true, prod: prod.name,
                               what: (ad.what || g.label) + '（提前买：「' + prod.name + '」快用完了）',
                               how: ad.how,
                               why: '你标了「' + prod.name + '」快用完 —— 它一没，' + g.label + '就断了：' + g.why,
                               pick: SHOP_PICKS[g.key] });

            });

        // ── 一版方案 ────────────────────────────────────────────────
        function regimenSkinTags() {
            const set = [];
            jrnlLastNDays(3).forEach(e => (e.status || []).forEach(t => { if (set.indexOf(t) < 0) set.push(t); }));
            return set;
        }
        // 家里有、但这一版方案**故意不排**的东西 + 为什么(别让人以为是漏掉了)
        function restingProducts() {
            const out = [];
            const cap = maxAcidPerWeek(), g = safetyGate();
            const planIds = new Set();
            // ⚠️ 只看**未来**排上没有:过去的日志里出现过一次(哪怕是极简模式推定的)也会让它
            //    看起来"排上了",于是这一版明明不排它,却不出现在「先不排」里(在 Cici 账号上实测到)。
            try { computePlanRolling().forEach(d => { if (d.isPast) return; (d.items || []).forEach(it => { if (it.id) planIds.add(it.id); }); }); } catch (e) {}
            activeProducts().forEach(p => {
                const t = p.schedule && p.schedule.type;
                if (!(t === 'acid' || t === 'mask' || t === 'retinol')) return;
                if (planIds.has(p.id)) return;
                let why = '这一版没排上';
                const gb = gateBlocks(p, g);
                if (gb) why = gb;
                else if (hasTrait(p, 'scrub')) why = '磨砂：闭口/发炎的脸上搓只会更糟';
                else if (hasTrait(p, 'strong-exfo')) why = '猛酸：离线规则不自动排，想用跟顾问说（还得先过安全闸）';
                else if (t === 'acid' && cap === 0) why = '本周去角质额度是 0';
                else if (t === 'acid') why = '同类里这一版先用另一支，别叠';
                else if (t === 'retinol' && !allowRetinol()) why = '先把温和酸练出耐受再加视黄醇';
                out.push({ id: p.id, name: p.name, why: why });
            });
            return out;
        }
        // 离线引擎出的一版(source:'engine')。顾问的方案由 commitAiRegimen() 落成一版(source:'ai')。
        function buildRegimen() {
            const a = assessSkin();
            const b = barrierScore();
            const cap = maxAcidPerWeek();
            const L = acidLadder();
            const t = today();
            let slot = { items: [] };
            try { slot = computePlanRolling().find(d => d.date === t) || { items: [] }; } catch (e) {}
            // 版本快照里的流程不带「今晚的小改」(那只是今晚的事),所以不传 date
            const ns = buildNightSteps(false, false, { items: slot.items || [] });
            // 方案上写的酸,必须就是排班真的会排的那支(否则方案说 A、今晚给 B,人会不知道信哪个)
            const acidIds = [];
            try {
                computePlanRolling().forEach(dd => { if (!dd.isPast) (dd.items || []).forEach(it => {
                    if (it.type === 'acid' && it.id && acidIds.indexOf(it.id) < 0) acidIds.push(it.id); }); });
            } catch (e) {}
            const acids = activeProducts().filter(p => p.role === 'acid' && !hasTrait(p, 'strong-exfo'));
            let acidNames = acidIds.map(id => (PD.find(x => x.id === id) || {}).name).filter(Boolean);
            if (!acidNames.length) { const g = acids.find(p => hasTrait(p, 'gentle-exfo')) || acids[0]; if (g) acidNames = [g.name]; }
            const acidPick = acidNames.length ? { name: acidNames.join(' / ') } : null;
            const cleanser = pickCleanser(activeProducts().filter(p => p.role === 'cleanse' &&
                ((p.schedule && p.schedule.time) || ['pm']).indexOf('pm') >= 0), { shower: false, acidTonight: false });
            return {
                date: t,
                source: 'engine',
                skin: {
                    overall: a.overall, barrier: b, phase: currentPhase(),
                    tags: regimenSkinTags(),
                    axes: a.axes.map(x => ({ key: x.key, name: x.name, score: x.score, dir: x.trend.dir }))
                },
                ladder: { level: L.level, why: L.why },
                rules: {
                    acidCap: cap,
                    acidName: acidPick ? acidPick.name : null,
                    acidZones: zonesAvoiding('acid'),
                    repair: repairUse(), repairWhy: repairReason(),
                    cleanse: cleanser ? cleanser.name : null,
                    resting: restingProducts(),
                    phase: currentPhase()
                },
                steps: ns.steps.map(x => ({ p: x.p, h: x.h })),
                using: activeProducts().filter(p => !restedNow(p)).map(x => ({ id: x.id, name: x.name, role: x.role })),
                gaps: regimenGaps().map(g => ({ key: g.key, label: g.label, why: g.why })),
                notes: (a.recs || []).filter(r => r.level === 'safety' || r.level === 'warn').map(r => ({ level: r.level, text: r.text }))
            };
        }
        // 皮肤状况的"指纹":分档取整(15 分一档),否则一分之差天天出新方案。
        // 判断口径一改,旧方案会一直挂在那儿(指纹只看皮肤和货架,不看代码) → 把引擎版本写进指纹,改口径就 +1。
        // e3(2026-10-29):屏障分不再被出油/闭口拉低;刷酸频率改成离线阶梯 + 安全闸
        // 方案的「指纹」:只认**有意义的变化** —— 货架变、刷酸额度变(阶梯档位 / 手动档)、阶段变、手动覆盖变、分区变。
        // 🔴 不含当天的状态标签和安全闸:那些是实时生效的(今晚该停的照停),不该每点一下状态就出一版方案,
        //    否则一晚上点错几下就把只留 12 版的历史冲掉,顾问改的版本也会被挤出去(AUDIT-ux P0-4 实测 v1→v5)。
        // e4(2026-10-29):指纹去掉状态标签;同一天的离线版本合并成一版
        const REGIMEN_ENGINE = 'e4';
        function skinSignature() {
            const L = acidLadder();
            return [L.level, PROFILE.acidLevel || '', PROFILE.repairUse || '', PROFILE.acidTiming || '',
                    userZones().map(z => z.name).sort().join(','), (PROFILE.concerns || []).join(',')].join('|');
        }
        function shelfSignature() {
            return shelfProducts().map(p => p.id + ':' + (PS[p.id] || p.statuses[0])).sort().join(',');
        }
        function regimenHistory() { return lg(K.regimen) || []; }
        function currentRegimen() { const h = regimenHistory(); return h.length ? h[h.length - 1] : null; }
        function newRegimenId() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
        function regimenDiffReason(prev, next) {
            const bits = [];
            const pIds = (prev.using || []).map(x => x.id), nIds = (next.using || []).map(x => x.id);
            (prev.using || []).forEach(x => { if (nIds.indexOf(x.id) < 0) bits.push('少了' + x.name); });
            (next.using || []).forEach(x => { if (pIds.indexOf(x.id) < 0) bits.push('多了' + x.name); });
            if (prev.rules && prev.rules.acidCap !== next.rules.acidCap) bits.push('刷酸 ' + prev.rules.acidCap + ' 次 → ' + next.rules.acidCap + ' 次/周' + (next.ladder ? '（' + next.ladder.why + '）' : ''));
            if (prev.rules && prev.rules.repair !== next.rules.repair) bits.push('修护霜改成' + (next.rules.repair === 'spot' ? '点涂' : '全脸薄涂'));
            if (prev.source === 'ai' && next.source !== 'ai') bits.push('回到离线规则');
            return bits.length ? bits.join('；') : '方案更新了';
        }
        // 唯一入口:指纹变了就出新版本。force = 用完了 / 补货 / 加产品 这类明确事件。
        // 顾问方案在位时它就是权威:皮肤状况的变化交给安全闸实时处理,不拿离线引擎的新版本盖掉它;只有货架真变了(force)才派生一版。
        // 同一天里离线规则又变了 → 改写当天那一版(版本号不涨),别把历史冲掉。
        function syncRegimen(reason, force) {
            let hist = regimenHistory();
            const last = hist.length ? hist[hist.length - 1] : null;
            if (last && last.source === 'ai') return force ? deriveAiRegimen(last, reason) : null;
            const sig = REGIMEN_ENGINE + '||' + skinSignature() + '||' + shelfSignature();
            if (!force && last && last.sig === sig) return null;
            const reg = buildRegimen();
            reg.sig = sig;
            reg.id = newRegimenId();
            reg.at = new Date().toISOString();
            const sameDay = !!last && last.source === 'engine' && last.date === today() && last.kind !== 'undo' && !force && !reason;
            const base = sameDay ? (hist.length > 1 ? hist[hist.length - 2] : null) : last;
            reg.v = sameDay ? last.v : (last ? (last.v || 0) : 0) + 1;
            reg.prevId = base ? base.id : null;
            const engChanged = !!last && last.source !== 'ai' && String(last.sig || '').indexOf(REGIMEN_ENGINE + '||') !== 0;
            reg.reason = reason || (engChanged ? '方案更新了：出油、闭口不再拉低屏障；刷酸从每周 1 次温和酸起步，按真实反应一档档加'
                : (base ? regimenDiffReason(base, reg) : '第一版：按家里现有的东西排'));
            if (sameDay) hist[hist.length - 1] = reg; else hist = hist.concat([reg]);
            ls(K.regimen, trimRegimenHist(hist));
            return reg;
        }
        // 只留最近 12 版;挤出去的时候优先留顾问的版本(别让离线版本把顾问方案冲掉)
        function trimRegimenHist(hist) {
            while (hist.length > 12) {
                const i = hist.findIndex((h, k) => k < hist.length - 1 && h.source !== 'ai');
                hist.splice(i >= 0 ? i : 0, 1);
            }
            return hist;
        }
        // 撤销 = 回到上一版。只有「当前这一版」能撤;撤销本身也记成一版,历史保持一条线
        function undoRegimen(id) {
            const hist = regimenHistory();
            const last = hist[hist.length - 1];
            if (!last || last.id !== id) return '后面已经有新的一版了，这一版撤不了；要改回去直接跟顾问说';
            const prev = (last.prevId && hist.find(h => h.id === last.prevId)) || (hist.length > 1 ? hist[hist.length - 2] : null);
            if (!prev) {
                hist.pop(); ls(K.regimen, hist); invalidatePlanCache();
                syncRegimen('撤销了 v' + last.v + '，回到离线规则', true);
                return '';
            }
            restoreRegimen(prev.id, '撤销了 v' + last.v + '，回到 v' + prev.v);
            return '';
        }
        // 回到某一版:把那一版复制成新的一版(source 照旧)
        function restoreRegimen(id, reason) {
            const hist = regimenHistory();
            const src = hist.find(h => h.id === id); if (!src) return null;
            const last = hist[hist.length - 1];
            const reg = Object.assign(JSON.parse(JSON.stringify(src)), {
                id: newRegimenId(), v: (last ? (last.v || 0) : 0) + 1, date: today(), at: new Date().toISOString(),
                kind: 'undo', prevId: src.id, reason: reason || ('回到 v' + src.v)
            });
            if (reg.source !== 'ai') reg.sig = REGIMEN_ENGINE + '||' + skinSignature() + '||' + shelfSignature();
            ls(K.regimen, trimRegimenHist(hist.concat([reg])));
            invalidatePlanCache();
            return reg;
        }
        // 变了什么 —— 说人话的理由,方便回看"这版为什么会变"
        // 唯一入口:指纹变了就出新版本。force=true 用于"用完了/补货了"这种明确事件。
        // 🔴 顾问方案在位时它就是权威:皮肤状况的变化交给安全闸实时处理(今晚该停的会停),
        //    不拿离线引擎的新版本把顾问方案盖掉;只有货架真变了(force)才派生一版,摘掉家里已经没有的东西。
        //    (顺带也少了一类「每次打开都写盘」—— 写盘 = 推送 = 可能的对推,见 8/29 事故)
        // 货架变了(用完 / 补货)而当前是顾问方案:沿用顾问的规矩,只把家里已经没有的东西摘掉,标「待重排」
        function deriveAiRegimen(last, reason) {
            const have = n => !!PD.find(p => p.name === n && !p.hidden);
            const r = JSON.parse(JSON.stringify(last.rules || {}));
            const dropped = [];
            if (r.acidName && !String(r.acidName).split(' / ').every(n => have(n.trim()))) { dropped.push(r.acidName); r.acidName = ''; }
            r.include = (r.include || []).filter(n => { if (have(n)) return true; dropped.push(n); return false; });
            r.resting = (r.resting || []).filter(x => x && have(x.name));
            const reg = Object.assign({}, last, {
                id: newRegimenId(), v: (last.v || 0) + 1, date: today(), at: new Date().toISOString(),
                rules: r, kind: 'derived', stale: true, blocked: [], prevId: last.id,
                reason: (reason || '货架变了') + (dropped.length ? '；方案里的「' + dropped.join('、') + '」家里没有了，这一版先摘掉' : '') + '。规矩沿用顾问上一版，可以让顾问按新货架重排。'
            });
            let hist = regimenHistory().concat([reg]).slice(-12);
            ls(K.regimen, hist);
            invalidatePlanCache();
            reg.gaps = regimenGaps().map(g => ({ key: g.key, label: g.label, why: g.why }));
            reg.using = activeProducts().filter(p => !restedNow(p)).map(x => ({ id: x.id, name: x.name, role: x.role }));
            hist[hist.length - 1] = reg; ls(K.regimen, hist);

        }
        // 顾问的方案落成一版(ai.js 调用;规矩已经过 _validateRegimen 安全闸)。
        // 快照部分(皮肤、在用的东西、缺口、这一版的流程)照常算;rules 用顾问的。
        // meta = {kind:'plan'|'chat'|'review', reason, rationale, blocked[], model, cost}
        function commitAiRegimen(rules, meta) {
            meta = meta || {};
            let hist = regimenHistory();
            const last = hist.length ? hist[hist.length - 1] : null;
            const base = buildRegimen();
            const reg = Object.assign(base, {
                id: newRegimenId(), v: (last ? (last.v || 0) : 0) + 1, source: 'ai', kind: meta.kind || 'plan',
                at: new Date().toISOString(), sig: 'ai', prevId: last ? last.id : null,
                reason: meta.reason || '顾问出的方案', rationale: meta.rationale || '',
                blocked: meta.blocked || [], model: meta.model || '', cost: meta.cost == null ? null : meta.cost,
                rules: Object.assign({ acidCap: 1, acidName: '', acidZones: [], cleanse: '', repair: '', repairWhy: '',
                    resting: [], include: [], zonesAdd: [], phase: '' }, rules)
            });

            hist = hist.concat([reg]).slice(-12);
            ls(K.regimen, hist);

            invalidatePlanCache();

            } catch (e) {}

            reg.gaps = regimenGaps().map(g => ({ key: g.key, label: g.label, why: g.why }));

            hist[hist.length - 1] = reg;
            ls(K.regimen, hist);
            return reg;
        }
        // 撤销一版顾问方案 = 回到上一版。只有「当前这一版」能撤(后面又出了新版的,撤它会把后面的也搅乱)。
        function regimenSummary(reg) {
            if (!reg) return '';
            const r = reg.rules || {};
            const bits = [];
            bits.push('刷酸：' + (r.acidCap ? (r.acidCap + ' 次/周' + (r.acidName ? '，用' + r.acidName : '') + (r.acidZones && r.acidZones.length ? '（避开' + r.acidZones.join('、') + '）' : '')) : '这一版先停'));
            if (r.cleanse) bits.push('洗脸：' + r.cleanse);
            bits.push('修护霜：' + (r.repair === 'spot' ? '只点涂' : '全脸薄涂') + (r.repairWhy ? '（' + r.repairWhy + '）' : ''));
            if ((r.resting || []).length) bits.push('先不排：' + r.resting.map(x => x.name).join('、'));
            if ((reg.gaps || []).length) bits.push('缺一环：' + reg.gaps.map(g => g.label).join('、') + '，家里没有能顶的了');

        }

        // 今晚页最上面的「当前方案」卡。顾问方案和离线规则都在这里;今晚实际按什么来 = 这里的规矩 × 安全闸。
        // (视觉先沿用旧卡片,等统一设计规范再整体重排 —— 2026-10-29 协调要求)
        // 今晚页最下面折叠的「这一版方案」:只写规矩和理由,不写具体步骤(步骤只有一处,就是今晚的列表 —— AUDIT-ux P1-11)
        function regimenOneLine(reg) {
            const r = (reg && reg.rules) || {};
            const cap = maxAcidPerWeek(), zonesA = zonesAvoiding('acid');
            return 'v' + (reg ? reg.v : '-') + ' · ' + (cap ? '刷酸 ' + cap + ' 次/周' + (r.acidName ? '（' + r.acidName + (zonesA.length ? '，避开' + zonesA.join('、') : '') + '）' : '') : '这周先不刷酸') + ' · 修护霜' + (repairUse() === 'spot' ? '点涂' : '全脸薄涂');
        }
        function renderRegimenCard() {
            const box = document.getElementById('regimen-card'); if (!box) return;

            if (sub) sub.textContent = reg ? regimenOneLine(reg) : '';
            if (!reg) { box.innerHTML = '<p class="small muted" style="padding-bottom:10px">还没有方案。加几样产品就会排出来。</p>'; return; }
            const r = reg.rules || {}, isAI = reg.source === 'ai', g = safetyGate();
            const cap = maxAcidPerWeek(), planned = Math.max(0, Math.round(+regimenRules().acidCap || 0));
            const zonesA = zonesAvoiding('acid');
            const rules = [];
            rules.push('刷酸：' + (cap ? cap + ' 次/周' + (r.acidName ? '，用' + esc(r.acidName) : '') + (zonesA.length ? '（避开' + esc(zonesA.join('、')) + '）' : '') : '这周先停') +
                (cap < planned ? `<span class="muted">（方案是 ${planned} 次，安全闸先压到 ${cap}）</span>` : ''));
            if (!isAI) rules.push('节奏：' + esc(acidLadder().why));
            if (r.cleanse) rules.push('洗脸：' + esc(r.cleanse));
            rules.push('修护霜：' + (repairUse() === 'spot' ? '只点涂' : '全脸薄涂') + '（' + esc(repairReason()) + '）');
            if ((r.include || []).length) rules.push('正式排进来：' + r.include.map(esc).join('、'));
            if ((r.resting || []).length) rules.push('先不排：' + r.resting.map(x => esc(x.name) + (x.why ? '（' + esc(x.why) + '）' : '')).join('、'));
            const gaps = (reg.gaps || []).map(x => `缺一环：<b>${esc(x.label)}</b>，家里没有能顶的了。${esc(x.why)}`).join('<br>');
            const actions = (typeof aiRegimenActionsHtml === 'function') ? aiRegimenActionsHtml(reg) : '';
            box.innerHTML = `<div style="padding-bottom:12px" data-src="${isAI ? 'ai' : 'engine'}">
                <div class="pc-row" style="justify-content:space-between"><span class="rg-t">方案 v${reg.v} · ${isAI ? '顾问' : '离线规则'}</span><span class="rg-v">${esc(reg.date || '')}</span></div>
                <div class="rg-why">${esc(isAI && reg.rationale ? reg.rationale : (reg.reason || ''))}</div>
                ${isAI && reg.rationale && reg.reason ? `<div class="rg-why">${esc(reg.reason)}</div>` : ''}
                <ul class="rg-rules">${rules.map(x => `<li>${x}</li>`).join('')}</ul>
                ${g.notes.length ? `<div class="rg-gap">安全闸：${esc(g.notes.join('；'))}</div>` : ''}
                ${(reg.blocked || []).length ? `<div class="rg-gap">没生效的几条：<br>${reg.blocked.map(b => esc(b.text) + '，' + esc(b.why)).join('<br>')}</div>` : ''}
                ${gaps ? `<div class="rg-gap">${gaps}</div>` : ''}

            </div>`;
        }

        // 开封天数(没填开封日期返回 null —— 不能当成"刚开始用",否则所有产品会同时报警)
        function openedDays(p) {
            const d = POPEN[p.id];
            if (!d) return null;

        }
        // 「今晚」页顶上那条补货黄条已经并进方案卡的「缺一环」里了(2026-08-26):
        // 判断要不要买,现在只有一个口径 —— regimenGaps()「这套方案对当前皮肤还成不成立」。
        // 同一页两处说同一件事只会让人不知道信哪个;产品页里那条"用完它就没有能顶替的了"是**提前预警**,
        // 性质不同,保留在那边。这里保留空函数,免改所有调用点。
        function renderSoleAlerts() {
            const box = document.getElementById('sole-alert');
            if (box) box.innerHTML = '';
        }
        function dismissSole(id) {
            const list = (PROFILE.soleDismissed || []).slice();
            if (!list.includes(id)) list.push(id);
            PROFILE.soleDismissed = list; saveProfile(); renderSoleAlerts();
        }

        // PAO 预警提前量：统一为"总时长的 15%，最多 4 周"，且保证不会在开封第 0 周就报警。
        // 旧版产品卡用 -4 周、今晚/早晨面板用 -2 周，两处对不上；且 paoMonths=1 时 4-4=0，一开封即"即将过期"。
        function paoLead(limitWeeks) { return Math.max(1, Math.min(4, Math.round(limitWeeks * 0.15), limitWeeks - 1)); }
        // PAO expiry alerts for Tonight/Morning panels

        // 生成"当晚护肤步骤"——「今晚」(renderTn) 与「排班点格」(showDayDetail) 共用这一套角色驱动逻辑，
        // 避免两个视图给出不一致的步骤、或印出已删产品名。slot = 排班引擎算出的当天计划(含 items)。
        // 生成「当晚护肤步骤」——今晚页、某一天的详情、方案快照共用这一套角色驱动逻辑。slot = 排班引擎算出的当天计划(含 items)。
        // 返回 {steps, skips, warnings}:
        //   steps    [{p 名字, h 怎么用, t 计时秒, kind 'acid'|'mask'|'retinol'|'base', chg 今晚被顾问改过}]
        //   skips    今晚不用的(普通信息,可以折叠)
        //   warnings 安全类提示 [{text, after 跟在第几步下面(-1 = 最后)}] —— 🔴 任何模式都显示,不能藏(AUDIT-ux P0-6:8/28 事故就是它被极简模式藏了)
        function buildNightSteps(shower, shave, slot) {
            shave = !!shave && !!PROFILE.shaving;
            const items = (slot && slot.items) || [];
            const schedAcid = items.find(it => it.type === 'acid');
            const schedMask = items.find(it => it.type === 'mask');
            const schedRet  = items.find(it => it.type === 'retinol');
            const hasScheduledAcid = !!schedAcid && !shave;
            const pd = id => PD.find(p => p.id === id);
            const active = id => { const p = pd(id); return p && !p.hidden && isSchedActive(p, PS[id] || p.statuses[0]); };
            const byRole = (role, single) => {
                const list = PD.filter(p => p.role === role && usableTonight(p) && ((p.schedule && p.schedule.time) || ['pm']).includes('pm'));
                return single ? list.slice(0, 1) : list;
            };
            const hint = p => p.pmHint || visNotes(p)[0] || '';
            const gate = safetyGate();
            const steps = [], skips = [], warnings = [];
            const add = (p, h, extra) => steps.push(Object.assign({ p: p, h: h || '', kind: 'base' }, extra || {}));
            if (shave) {
                add('凉水冲洗（刮完立刻）', '降温止红');
                byRole('repair').forEach(p => add(p.name, hint(p) || '全脸薄涂，修护刮出来的小伤口'));
                byRole('serum').forEach(p => add(p.name, hint(p) || '全脸轻拍到吸收'));
                byRole('moist', true).forEach(p => add(p.name, hint(p) || '无香精封层'));
                skips.push('刷酸、维 A、泥膜（刮胡夜都不上）');
            } else {
                const ctx = { shower: shower, acidTonight: hasScheduledAcid };
                const cleanser = pickCleanser(byRole('cleanse'), ctx);
                const pre = byRole('precleanse', true)[0];
                const wantPre = !!PROFILE.useMakeupRemoval;
                if (cleanser) {
                    const why = cleanserReason(ctx);
                    const preNote = (wantPre && pre) ? `（化了妆或涂了厚防晒，先用${pre.name}卸）` : '';
                    add(cleanser.name, (why ? why + '；' : '') + (cleanser.pmHint || '打圈 30 到 60 秒，温水洗净') + preNote, { t: 60 });
                } else if (wantPre && pre) add(pre.name, hint(pre) || '化了妆或厚防晒时用');
                else add('温水冲洗', '家里还没有洁面，去「产品」加一支');
                const irritated = irritatedNow();
                let faceCovered = false;
                const soothers = irritated ? byRole('soothe') : [];
                soothers.forEach(p => add(p.name, (hint(p) || '敷 5 分钟左右洗掉') + '（最近有泛红才用）', { t: 300 }));
                if (hasScheduledAcid) {
                    const ap = pd(schedAcid.id); const aName = ap ? ap.name : schedAcid.label;
                    add(aName, ((ap && hint(ap)) || '薄涂，停留 3 到 5 分钟，不用冲') + (shower ? '；洗完澡等脸完全干了再涂' : '') + zoneHintFor('acid') +
                        (schedAcid.down ? '（今晚降一档：只薄涂一层、时间减半，刺痛马上洗掉）' : ''),
                        { kind: 'acid', chg: !!(schedAcid.down || schedAcid.byAI) });
                    skips.push('修护精华（刷酸夜不用）', '维 A（刷酸夜不叠）');
                    const ip = ap && introNightsLeft(ap);
                    if (ip) warnings.push({ text: '这支酸还在试用的头几晚，别和别的新东西同一晚上脸：出了问题分不清是谁。', after: steps.length - 1 });
                } else if (schedMask) {
                    const mp = pd(schedMask.id);
                    if (mp && active(mp.id)) { add(mp.name, (hint(mp) || '敷 10 到 15 分钟后冲干净') + zoneHintFor('mask'), { t: 900, kind: 'mask', chg: !!schedMask.byAI }); skips.push('维 A（面膜夜不叠）'); }
                } else if (schedRet) {
                    const rp = pd(schedRet.id);
                    if (rp && active(rp.id)) { add(rp.name, (hint(rp) || '每周 1 次，薄涂全脸') + zoneHintFor('retinol'), { kind: 'retinol', chg: !!schedRet.byAI }); skips.push('刷酸（维 A 夜不叠）'); }
                } else {
                    // 正在泛红/发炎、或最近一直闷闭口时,含精油·香精的精华和面油先不上 —— 方案要「对现在这张脸起作用」,不是「把家里的东西都排上」
                    const gentleOK = p => !blockedNow(p) && !gateBlocks(p, gate);
                    byRole('serum').forEach(p => gentleOK(p) ? (add(p.name, hint(p) || '全脸轻拍到吸收'), faceCovered = true) : skips.push(p.name + '（含精油 / 香精，泛红或闷闭口时先停）'));
                    if (!shower) byRole('oil').forEach(p => gentleOK(p) ? (add(p.name, hint(p) || '1 到 2 滴，两颊和脖子，额头避开'), faceCovered = true) : skips.push(p.name + '（' + (gateBlocks(p, gate) || '闭口 / 发炎期面油先停') + '）'));
                }
                byRole('eye', true).forEach(p => add(p.name, hint(p) || '无名指轻拍眼眶骨'));
                const needCalm = irritated && !soothers.length;
                const spotUse = repairUse() === 'spot';
                byRole('moist', true).forEach(p => {
                    const intro = introHint(p);
                    add(p.name, (hasScheduledAcid ? '刷完酸直接封层' : (hint(p) || '全脸封层')) +
                        (intro || (needCalm && hasTrait(p, 'calm') && !hasTrait(p, 'occlusive') ? '（最近有泛红：这支自带镇静成分，泛红处多按一层）' : '')));
                    faceCovered = true;
                    if (intro && hasScheduledAcid) warnings.push({ text: '今晚既刷酸、又是这支保湿的头几晚：建议酸往后挪一晚，两样一起上，出了问题分不清是谁。', after: steps.length - 1 });
                });
                const clogged = jrnlLastNDays(14).some(e => (e.status || []).some(s => s === '闭口' || s === '爆痘'));
                byRole('repair').forEach(p => {
                    add(p.name, (spotUse ? ('痘痘处、口罩线点涂' + (clogged && !PROFILE.repairUse ? '（近期有闭口 / 痘，先别全脸厚涂）' : '')) : '全脸薄涂封层') + (needCalm ? '（最近有泛红，泛红处多带一下）' : ''));
                    if (!spotUse) faceCovered = true;
                });
                // 🔴 洗完全脸什么都不涂 = 屏障只会更差。剩下的东西全被停掉 / 只点涂时必须说出来(2026-08-28 事故)
                if (!faceCovered && PD.some(p => !p.hidden)) warnings.push({ text: '洗完全脸没有能涂的东西了：保湿这一档是空的。去「产品」看「要不要买新的」。', after: 0 });
            }
            // 今晚的小改(顾问 change_tonight)里**非活性**的那几条在这里落:跳过 / 换一支 / 临时加一支。只对今天生效。
            const ov = (slot && slot.date && slot.date === today()) ? tonightOverride() : null;
            if (ov && !shave) {
                const roleIdx = n => { const q = PD.find(x => x.name === n); return q ? ROLE_ORDER.indexOf(q.role) : -1; };
                ov.ops.forEach(c => {
                    const why = c.why ? '：' + c.why : '';
                    if (c.op === 'skip') {
                        const i = steps.findIndex(x => x.p === c.product);
                        if (i >= 0) { steps.splice(i, 1); skips.push(c.product + '（顾问：今晚先跳过' + why + '）'); warnings.forEach(w => { if (w.after >= i) w.after = Math.max(-1, w.after - 1); }); }
                    } else if (c.op === 'swap') {
                        const st = steps.find(x => x.p === c.product), np = PD.find(x => x.name === c.to);
                        if (st && np && !gateBlocks(np, gate)) { st.p = np.name; st.h = (hint(np) || '') + '（顾问今晚换的' + why + '）'; st.chg = true; }
                    } else if (c.op === 'add') {
                        const np = PD.find(x => x.name === c.product);
                        const t = np && np.schedule && np.schedule.type;
                        if (!np || ['acid', 'mask', 'retinol'].includes(t) || steps.some(x => x.p === np.name) || gateBlocks(np, gate)) return;
                        const ri = ROLE_ORDER.indexOf(np.role);
                        let at = steps.findIndex(x => roleIdx(x.p) > ri);
                        if (at < 0) at = steps.length;
                        steps.splice(at, 0, { p: np.name, h: (hint(np) || '') + '（顾问今晚加的' + why + '）', kind: 'base', chg: true });
                        warnings.forEach(w => { if (w.after >= at) w.after++; });
                    }
                });
            }
            if (LOW.length) {
                const lowNames = LOW.map(id => (PD.find(x => x.id === id) || {}).name).filter(Boolean);
                steps.forEach(st => { if (lowNames.indexOf(st.p) >= 0) st.h = (st.h || '') + '（这支快用完了）'; });
            }
            return { steps, skips, warnings };
        }
        // ══ 打卡:「今晚做完了」—— 一个明确的动作(状态胶囊是一下一下点的,不能每点一下就去问顾问)══
        // 打卡只是在今天的记录上标 done;顾问那边会异步给一张反馈卡(ai.js)。没开通 / 连不上也照样能打卡。

        function renderAm() { }   // 早晨面板早就按要求移除了;留空桩免改调用点

        // ══ Rolling Schedule Engine ══════════════════════════════════


        

        function sysAlert(msg, title) { openSheet({ title: title || '', text: String(msg), actions: [{ label: '知道了', primary: true }] }); }

        function sysConfirm(msg, onConfirm, opts) {
            opts = opts || {};
            openSheet({ title: opts.title || '', text: String(msg), actions: [{ label: opts.cancel || '取消', fn: opts.onCancel }, { label: opts.ok || '确定', primary: true, fn: onConfirm }] });
        }

        // toggleDay now accepts a date string — past dates are immutable

        // 极简模式的核心语义(Cait 2026-08-15 定)：「app 说用什么她就用什么，排上的默认用了」。
        // 昨天(或最后一次打开那天)计划里的酸/泥膜/视黄醇 → 按「已执行」推定并入当天日志(auto:true)。
        // 是**合并**不是跳过：她哪天随手勾过一个步骤,那天的酸也不能因此漏记——
        // 手动记录原样保留,只补处方里缺的活性。宁可把下一次酸排远一点,也不能每天失忆、天天排酸。
        // 完整模式(Cait)的空白日仍按"没做"处理,不推定。
        // 极简模式的核心语义(Cait 2026-08-15 定,10-29 补):「排上的默认用了」——
        // 昨天(或最后一次打开那天)计划里的酸/泥膜/维 A → 按「已执行」推定并入当天日志(auto:true)。
        // 🔴 她在今晚页点了「今晚没做」的那几样**不补**(entry.skipped 里的):越听话数据越错的老问题(AUDIT-ux P0-5)。
        // 是合并不是跳过:手动记录原样保留,只补处方里缺的活性。完整模式的空白日仍按"没做"处理,不推定。
        function absorbPrescribedHistory() {
            try {
                if (!PROFILE.minimalMode) return false;
                const pd = lg(K.planday);
                if (!pd || !pd.date || pd.date >= today() || !(pd.items || []).length) return false;
                const e = lg(K.jrnl) || [];
                let entry = e.find(x => x.date === pd.date);
                const skipped = new Set((entry && entry.skipped) || []);
                const missing = pd.items.filter(it => it.tag && !(entry && (entry.products || []).includes(it.tag)) && !skipped.has(it.tag) && !(it.name && skipped.has(it.name))).map(it => it.tag);
                if (!missing.length) return false;
                if (!entry) { entry = { date: pd.date, status: [], products: [], note: '', phase: '' }; e.push(entry); }
                entry.products = entry.products || [];
                missing.forEach(t => entry.products.push(t));
                entry.auto = true;
                if (!entry.note) entry.note = '（按当天计划推定）';
                e.sort((a, b) => String(b.date).localeCompare(String(a.date)));
                ls(K.jrnl, e.slice(0, 365));
                return true;
            } catch (err) { return false; }
        }

        // computePlanRolling: builds plan for a 15-day rolling window.
        // Cached per render cycle to avoid recomputing 3× (renderTn + renderWk + showDayDetail).
        let _planCache = null, _planCacheKey = '';
        function invalidatePlanCache() { _planCache = null; _planCacheKey = ''; }
        function computePlanRolling() {
            // 必须在读日志/建缓存键之前吸收历史处方(见 absorbPrescribedHistory 注释):
            // 它一旦写入,下方的 jrStr/种子/额度统计都会自动把"推定已刷酸"算进去。
            absorbPrescribedHistory();
            // Cache key: today + wk data content hash + jrnl length + product states
            // 缓存 key 必须覆盖所有会改变排班结果的输入。
            // 旧 key 不含 PD，日志只看条数 —— 于是改完产品的"每周上限"点保存，排班纹丝不动（看起来像没保存）；
            // 在今晚面板勾掉一个酸类步骤（改的是已有条目的 products，条数不变）也不会重算。
            const wkStr = JSON.stringify(lg(K.wk) || {});
            const pdStr = JSON.stringify(PD.map(x => [x.id, !!x.hidden, x.schedule]));
            const jr = lg(K.jrnl) || [];
            const jrStr = JSON.stringify(jr.slice(0, 30).map(x => [x.date, x.products, x.status, x.phase]));
            // 方案(顾问版本 / 离线阶梯档位)、今晚的小改、档案里影响排法的几项,也都会改变排班结果
            const cr = currentRegimen();
            const ckey = today() + '|' + wkStr + '|' + jr.length + '|' + jrStr + '|' + pdStr + '|' + JSON.stringify(PS) + '|' +
                (cr ? (cr.id || cr.v) + ':' + (cr.source || '') : '-') + '|' + JSON.stringify(tonightOverride()) + '|' +
                JSON.stringify([PROFILE.acidLevel, PROFILE.acidLevelAt, !!PROFILE.minimalMode, !!PROFILE.hrt, PROFILE.zones, PROFILE.excluded, PROFILE.acidTiming]);
            if (_planCache && _planCacheKey === ckey) return _planCache;

            const days = getRollingDays();
            const t = today();

            // --- Seed past days with journal data (what actually happened) ---
            const jrnl = lg(K.jrnl) || [];
            const acidTags = getAcidTags();
            const retinolTags = PD.filter(p => !p.hidden && p.schedule && p.schedule.type === 'retinol').map(p => p.journalTag || p.name);
            const maskTags   = PD.filter(p => !p.hidden && p.schedule && p.schedule.type === 'mask').map(p => p.journalTag || p.name);

            days.forEach(day => {
                // 今天也要回填：今晚勾掉酸类步骤会写进日志,若不回填,重算时今天的酸槽被间隔规则跳过,
                // 刚勾的步骤就从「今晚」列表凭空消失(只剩 meta 行的"今天已用酸")。回填后它占住今天的槽位。
                if (day.isPast || day.isToday) {
                    const entry = jrnl.find(e => e.date === day.date);
                    if (entry) {
                        const prods = entry.products || [];
                        prods.forEach(tag => {
                            // 尽量解析回真实产品 id：今天的槽位会进 buildNightSteps,
                            // id 为 null 时步骤名会退化成 journalTag,勾选状态就对不上号
                            const rp = PD.find(p => (p.journalTag || p.name) === tag);
                            const pid = rp ? rp.id : null, plabel = rp ? rp.name : tag;
                            if (acidTags.includes(tag))    day.items.push({ id: pid, type: 'acid', label: plabel, logged: true });
                            if (retinolTags.includes(tag)) day.items.push({ id: pid, type: 'retinol', label: plabel, logged: true });
                            if (maskTags.includes(tag))    day.items.push({ id: pid, type: 'mask', label: plabel, logged: true });
                        });
                    }
                    // Derive acid/clay/retinol props for rendering
                    const ai = day.items.find(it => it.type === 'acid');
                    day.acid = ai ? ((PD.find(d => d.id === ai.id) || {}).journalTag || ai.label) : null;
                    day.acidLabel = day.acid;
                    day.clay = day.items.some(it => it.type === 'mask');
                    day.retinol = day.items.some(it => it.type === 'retinol');
                    day.avene = false;
                }
            });

            // --- Auto-schedule today + future days ---
            const futureDays = days.filter(d => !d.isPast); // today + next 7
            const dayDist = (a, b) => Math.abs(Math.round((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 86400000));
            // schedule 字段的默认值必须用 ?? 而不是 ||：0 是合法值（"上限0次"=停用、"间隔0天"=允许连着两晚），
            // 旧版 `maxPerWeek || 1` / `minDaysBetween || 2` 把用户填的 0 直接吃掉，怎么调都没反应。
            const capOf = p => (p.schedule.maxPerWeek ?? 1);
            const gapOf = p => (p.schedule.minDaysBetween ?? 2);

            const maxAcid = maxAcidPerWeek();
            // 近 7 天（滚动）已用掉的去角质天数——含泥膜
            const journalAcidCnt = exfoliantCountInLastNDays(7);
            const la = lastAcidUsed();
            const lastAcidDate = (() => { const e = lastAcidEntry(); return e ? e.date : null; })();

            // 某产品在过去 n 天里实际用过几天 / 最近一次用是哪天（从日志读，排班才知道"昨天已经用过了"）
            const pastUseDates = prod => {
                const tag = prod.journalTag || prod.name;
                return jrnlLastNDays(7).filter(x => (x.products || []).includes(tag)).map(x => x.date);
            };

            // 谁有资格被自动排:家里有、没标不用、这一版方案没停它、状态启用(或被顾问点名启用)。
            // 酸类:**频率由方案定**(顾问 / 离线阶梯),产品自己的「每周上限」不再决定总次数;设成 0 或关掉自动排班仍算「别排它」,
            // 除非顾问方案点名要用它。面膜/视黄醇仍按各自的每周上限。
            const rr = regimenRules(), gate = safetyGate();
            const namedByRule = p => !!rr.acidName && String(rr.acidName).split(' / ').map(x => x.trim()).indexOf(p.name) >= 0;
            let schedulable = PD.filter(p => !p.hidden && !isExcluded(p) && !restedNow(p) && p.schedule &&
                ['acid','mask','retinol'].includes(p.schedule.type) &&
                (isSchedActive(p, PS[p.id] || p.statuses[0]) || includedNow(p)) &&
                ((p.schedule.enableAutoSchedule && capOf(p) > 0) || (rr.source === 'ai' && (namedByRule(p) || includedNow(p)))));
            // 安全闸(唯一红线):在发炎 → 猛酸/磨砂/泥膜/视黄醇不上;HRT 波动期 → 猛酸/视黄醇不上;酸记到反应 → 酸停
            schedulable = schedulable.filter(p => !gateBlocks(p, gate));
            if (!allowMask())    schedulable = schedulable.filter(p => p.schedule.type !== 'mask');
            if (!allowRetinol()) schedulable = schedulable.filter(p => p.schedule.type !== 'retinol');
            let acids      = schedulable.filter(p => p.schedule.type === 'acid');
            const masks    = schedulable.filter(p => p.schedule.type === 'mask');
            const retinols = schedulable.filter(p => p.schedule.type === 'retinol');
            // 用哪支酸:顾问方案点了名就只用那支;离线兜底只轮换温和酸 —— 猛酸(甘醇酸这类)**从不自动排**,
            // 要用只能由顾问方案点名(而且还得过安全闸)。
            const named = acids.filter(namedByRule);
            if (named.length) acids = named;
            else acids = acids.filter(p => !hasTrait(p, 'strong-exfo') || (rr.source === 'ai' && includedNow(p)));

            // === Phase 1: Acids ===
            const acidSlotsLeft = Math.max(0, maxAcid - journalAcidCnt);
            let acidOrder = [...acids];
            if (la) {
                const li = acidOrder.findIndex(a => (a.journalTag||a.name) === la);
                if (li > 0) acidOrder = [...acidOrder.slice(li), ...acidOrder.slice(0, li)];
                if (acidOrder.length > 1) acidOrder.push(acidOrder.shift());
            }
            const acidSlots = [];
            for (let n = 0; acidOrder.length && n < acidSlotsLeft; n++) acidSlots.push(acidOrder[n % acidOrder.length]);

            const assignedAcidDates = [];
            for (const prod of acidSlots) {
                let bestIdx = -1, bestScore = -Infinity;
                for (let i = 0; i < futureDays.length; i++) {
                    const fd = futureDays[i];
                    if (fd.shave && prod.schedule.avoidShaveDay) continue;
                    if (fd.items.some(it => it.type === 'acid')) continue;
                    // 泥膜占去角质额度，同晚也不叠 —— 已排了泥膜的日子不再排酸
                    if (fd.items.some(it => it.type === 'mask')) continue;
                    const allAcidDates = lastAcidDate ? [lastAcidDate, ...assignedAcidDates] : [...assignedAcidDates];
                    let minDist = 999;
                    for (const d of allAcidDates) minDist = Math.min(minDist, dayDist(fd.date, d));
                    if (allAcidDates.length > 0 && minDist < gapOf(prod)) continue;
                    // 近 7 天滚动上限：这一天往前数 7 天内的去角质总数不得超过 maxAcid
                    const windowFrom = localD(new Date(new Date(fd.date + 'T12:00:00').getTime() - 6 * 86400000));
                    const inWindow = jrnlLastNDays(7).filter(x => x.date >= windowFrom && x.date <= fd.date &&
                        (x.products || []).some(t => getExfoliantTags().includes(t))).length
                        + assignedAcidDates.filter(d => d >= windowFrom && d <= fd.date).length;
                    if (inWindow >= maxAcid) continue;
                    // 【循证修正 2026-08】"酸优先洗澡夜"没有证据支持,方向反而可能有害:
                    // 热水浸泡后 TEWL 翻倍、pH 升高、红斑增加(PMC8778033)——所谓"渗透增强"本身就是屏障受损的表现;
                    // AAD 把 AHA 列入玫瑰痤疮者避免清单,中国玫瑰痤疮指南把冷热刺激列为诱发因素。
                    // 因此改为**用户可选的时机偏好**,默认"无所谓";易泛红/有问题区域的人默认避开洗澡夜。
                    let score = minDist * 10;
                    const tim = acidTiming();
                    if (tim === 'prefer' && prod.schedule.preferShowerNight) score += fd.shower ? 25 : -12;
                    else if (tim === 'avoid') score += fd.shower ? -25 : 12;
                    if (score > bestScore) { bestScore = score; bestIdx = i; }
                }
                if (bestIdx >= 0) {
                    futureDays[bestIdx].items.push({ id: prod.id, type: 'acid', label: prod.name });
                    assignedAcidDates.push(futureDays[bestIdx].date);
                }
            }

            // === Phase 2: Masks ===
            // 计数必须把"过去 7 天日志里已经用过的次数"算进去。旧版 placed 每次重算都从 0 起，
            // 而 futureDays 只有今天和未来，历史用量从不进入判断 —— 于是 maxPerWeek:1 的泥膜天天被重排。
            // 泥膜也占"去角质额度",必须和酸类查同一本账，否则计划里稳定超发、次日引擎又回头把酸清空
            const exfoliantLoadAt = (dateStr) => {
                const windowFrom = localD(new Date(new Date(dateStr + 'T12:00:00').getTime() - 6 * 86400000));
                const fromJrnl = jrnlLastNDays(7).filter(x => x.date >= windowFrom && x.date <= dateStr &&
                    (x.products || []).some(t => getExfoliantTags().includes(t))).length;
                const fromPlan = futureDays.filter(d => d.date >= windowFrom && d.date <= dateStr &&
                    d.items.some(it => it.type === 'acid' || it.type === 'mask')).length;
                return fromJrnl + fromPlan;
            };
            masks.forEach(prod => {
                const used = pastUseDates(prod);
                let placed = used.length;
                const takenDates = [...used];
                // 外层按"还差几次"循环，内层 pass 0/1 由紧到松；旧版写死 pass<2，maxPerWeek≥3 永远排不出来
                let guard = 0;
                while (placed < capOf(prod) && guard++ < 14) {
                    let bestIdx = -1, bestScore = -Infinity;
                    for (let pass = 0; pass < 2 && bestIdx < 0; pass++) {
                        for (let i = 0; i < futureDays.length; i++) {
                            const fd = futureDays[i];
                            if (fd.shave && prod.schedule.avoidShaveDay) continue;
                            if (fd.items.some(it => it.type === 'mask')) continue;
                            if (prod.schedule.avoidAcid && fd.items.some(it => it.type === 'acid')) continue;
                            if (prod.schedule.preferShowerNight && !fd.shower && pass === 0) continue;
                            if (exfoliantLoadAt(fd.date) >= maxAcid) continue;   // 与酸类共用去角质预算
                            let minDist = 999;
                            for (const d of takenDates) minDist = Math.min(minDist, dayDist(fd.date, d));
                            if (takenDates.length > 0 && minDist < gapOf(prod)) continue;
                            const score = minDist * 10 + (prod.schedule.preferShowerNight ? (fd.shower ? 60 : -30) : 0);
                            if (score > bestScore) { bestScore = score; bestIdx = i; }
                        }
                    }
                    if (bestIdx < 0) break;
                    futureDays[bestIdx].items.push({ id: prod.id, type: 'mask', label: prod.name });
                    takenDates.push(futureDays[bestIdx].date); placed++;
                }
            });

                const used = pastUseDates(prod);

                const takenDates = [...used];
                let guardR = 0;
                while (placed < capOf(prod) && guardR++ < 14) {   // 同上：外层按剩余次数循环，别写死 2 次
                    let bestIdx = -1, bestScore = -Infinity;
                    for (let pass = 0; pass < 2 && bestIdx < 0; pass++) {
                    for (let i = 0; i < futureDays.length; i++) {
                        const fd = futureDays[i];
                        if (fd.shave && prod.schedule.avoidShaveDay) continue;
                        if (fd.items.some(it => it.type === 'retinol')) continue;
                        if (prod.schedule.avoidAcid && fd.items.some(it => it.type === 'acid')) continue;

            (function applyTonightOverride() {
                const ov = tonightOverride(); if (!ov) return;

                const ACT = ['acid', 'mask', 'retinol'];
                const nameOf = it => { const q = PD.find(x => x.id === it.id); return q ? q.name : it.label; };
                ov.ops.forEach(c => {

                                .find(x => x.id !== cur.id && hasTrait(x, 'gentle-exfo') && !gateBlocks(x, gate));
                            if (mild) { ai.id = mild.id; ai.label = mild.name; ai.down = true; } else ai.down = true;
                        } else ai.down = true;
                    } else if (c.op === 'skip') {
                        ts.items = ts.items.filter(it => it.logged || !ACT.includes(it.type) || nameOf(it) !== c.product);
                    } else if (c.op === 'swap') {
                        const it = ts.items.find(x => !x.logged && ACT.includes(x.type) && nameOf(x) === c.product);
                        const np = PD.find(x => x.name === c.to);
                        if (it && np && !gateBlocks(np, gate)) { it.id = np.id; it.label = np.name; it.type = (np.schedule && ACT.includes(np.schedule.type)) ? np.schedule.type : it.type; }
                    } else if (c.op === 'add') {
                        const np = PD.find(x => x.name === c.product);
                        const t = np && np.schedule && np.schedule.type;
                        if (!np || !ACT.includes(t) || gateBlocks(np, gate) || ts.items.some(x => x.type === t)) return;
                        if (t === 'acid' && (maxAcid === 0 || ts.shave || journalAcidCnt >= gate.acidCapMax)) return;   // 安全闸压到 0 / 已到闸门上限 / 刮胡夜:不加酸

        function todayLogged() { return (lg(K.jrnl) || []).some(x => x.date === today()); }

            let streak = 0, i = dates.has(today()) ? 0 : 1;

        function weekRange(weekStartMon) {
