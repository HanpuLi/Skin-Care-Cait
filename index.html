<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
    <meta charset="UTF-8">
    <!-- 不锁死缩放:禁用双指放大对看不清小字的人是无障碍问题 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f1ea">
    <!-- 首帧前定主题(跟随系统 / 纸 / 夜 / 晚上自动),免得深色模式先闪一下浅色 -->
    <script>(function(){var d=false;try{var t=localStorage.getItem('sk_theme')||'system',h=new Date().getHours();d=t==='dark'||(t==='auto'&&(h>=21||h<7))||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);}catch(e){}document.documentElement.setAttribute('data-theme',d?'dark':'light');var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',d?'#161412':'#f4f1ea');})();</script>
    <title>护肤计划</title>
    <link rel="icon" href="icon-192.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="apple-mobile-web-app-title" content="护肤计划">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- 字体全部自托管(fonts/,SW 预缓存,离线可用) -->
    <link rel="preload" href="fonts/noto-serif-sc-400-skin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/screens/tonight.css">
    <link rel="stylesheet" href="css/screens/advisor.css">
    <link rel="stylesheet" href="css/screens/record.css">
    <link rel="stylesheet" href="css/screens/products.css">
    <link rel="stylesheet" href="css/screens/capture.css">
    <link rel="stylesheet" href="css/screens/settings.css">
    <link rel="stylesheet" href="css/screens/oobe.css">
    <!-- Firebase SDK(compat v9,全局 firebase)不在这里同步加载:弱网下三个同步脚本会挡住解析。
         js/app.js 画完第一屏后再按顺序插入(SW 也缓存它们);加载不到(离线 / 被墙)就只用本机数据 -->
    <!-- 看门狗(经典脚本,不依赖任何模块):模块图里任何一个文件没加载到 / 链接失败,App 会变成没有提示的空壳。
         8 秒(有加载错误时 1.5 秒)后还没启动、也没有锁提示 / 启动出错提示,就给一张「重新加载」;不往 window 上挂东西 -->
    <script>(function(){var de=document.documentElement,tries=0;try{tries=+sessionStorage.getItem('sk_bootfail')||0;}catch(e){}
function ok(){var b=de.getAttribute('data-boot');return b==='ok'||b==='locking'||document.getElementById('app-lock')||document.getElementById('boot-fail');}
function clearCaches(){if(!window.caches)return Promise.resolve();return caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf('skincare-app-')===0;}).map(function(k){return caches.delete(k);}));}).catch(function(){});}
function reload(clean){if(navigator.onLine===false){var n=document.getElementById('boot-fail-msg');if(n)n.textContent='现在没网：连上网再点。';return;}
try{sessionStorage.setItem('sk_bootfail',String(tries+1));}catch(e){}
var up=navigator.serviceWorker&&navigator.serviceWorker.getRegistration?navigator.serviceWorker.getRegistration().then(function(r){return r&&r.update();}).catch(function(){}):Promise.resolve();
up.then(function(){return clean?clearCaches():null;}).then(function(){location.reload();},function(){location.reload();});}
function show(){if(ok())return;var root=document.getElementById('sheet-root')||document.body;if(!root)return;
var old=!('locks' in navigator)||!('noModule' in document.createElement('script'));
var ov=document.createElement('div');ov.id='boot-fail';ov.className='sheet-ov';ov.setAttribute('data-noesc','1');
ov.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="boot-fail-t"><div class="sheet-h"><h2 class="sheet-t" id="boot-fail-t">'+(old?'这台设备的系统版本太旧':'这一版没加载完整')+'</h2></div><div class="sheet-b text"><p class="lede">'+(old?'这一版要 iOS 15.4 或更新的系统（电脑上用新版浏览器）。记录都在这台设备上，一个字没动。':'网络断了一半，或者刚更新。记录都在这台设备上，一个字没动。')+'</p><p class="note" id="boot-fail-msg"></p></div><div class="sheet-actions"></div></div>';
var acts=ov.querySelector('.sheet-actions');
function btn(label,primary,fn){var b=document.createElement('button');b.type='button';b.className='btn'+(primary?' btn-primary':'');b.textContent=label;b.addEventListener('click',fn);acts.appendChild(b);}
if(!old&&tries>0&&navigator.onLine!==false)btn('清掉缓存重新加载',false,function(){reload(true);});
btn('重新加载',true,function(){reload(false);});
root.appendChild(ov);}
function later(){if(de.getAttribute('data-boot')==='ok'){try{sessionStorage.removeItem('sk_bootfail');}catch(e){}return;}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',show);else show();}
var t=setTimeout(later,8000);
window.addEventListener('error',function(e){var el=e&&e.target;var mod=el&&el.tagName==='SCRIPT'&&/\/js\//.test(el.src||'');if(!mod&&!(e instanceof ErrorEvent))return;if(ok())return;clearTimeout(t);t=setTimeout(later,1500);},true);})();</script>
    <!-- App:原生 ES modules,无构建步骤。js/app.js 先拿「本设备只开一个窗口」的锁,拿到了才碰记录 -->
    <script type="module" src="js/app.js"></script>
</head>
<!-- 外壳只有挂载点;每一屏由 js/ui/*.js 渲染。结构见 ARCHITECTURE.md -->
<body>
    <div class="wrap">
        <header class="hdr">
            <span class="eyebrow" id="hdr-date"></span>
            <span class="net" id="net-badge" hidden>离线 · 改动先存在本机</span>
            <button type="button" class="seal" id="btn-settings" aria-label="设置"><span id="seal-ch" aria-hidden="true">我</span></button>
        </header>
        <div id="sync-toast-el" class="toast" role="status" aria-live="polite"></div>
        <main>
            <section id="tonight" class="panel active" role="tabpanel" aria-labelledby="tab-tonight"></section>
            <section id="advisor" class="panel" role="tabpanel" aria-labelledby="tab-advisor"></section>
            <section id="record" class="panel" role="tabpanel" aria-labelledby="tab-record"></section>
            <section id="products" class="panel" role="tabpanel" aria-labelledby="tab-products"></section>
        </main>
    </div>
    <nav class="tabbar" aria-label="主导航"><div class="tabbar-in" role="tablist">
        <button type="button" class="tab" id="tab-tonight" data-tab="tonight" role="tab" aria-selected="true" aria-controls="tonight">今晚</button>
        <button type="button" class="tab" id="tab-advisor" data-tab="advisor" role="tab" aria-selected="false" aria-controls="advisor">顾问</button>
        <button type="button" class="tab rec-tab" id="tab-record" data-tab="record" role="tab" aria-selected="false" aria-controls="record">记录</button>
        <button type="button" class="tab" id="tab-products" data-tab="products" role="tab" aria-selected="false" aria-controls="products">产品</button>
    </div></nav>
    <div id="sheet-root"></div>
    <noscript><p class="wrap note">护肤计划需要打开 JavaScript。</p></noscript>
</body>
</html>
