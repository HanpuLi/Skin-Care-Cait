<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
    <meta charset="UTF-8">
    <!-- 不锁死缩放:禁用双指放大对看不清小字的人是无障碍问题 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f1ea">
    <!-- 首帧前定主题(跟随系统 / 纸 / 夜 / 晚上自动),免得深色模式先闪一下浅色 -->
    <script>(function(){var d=false;try{var t=localStorage.getItem('sk_theme')||'system',h=new Date().getHours();d=t==='dark'||(t==='auto'&&(h>=21||h<7))||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);}catch(e){}document.documentElement.setAttribute('data-theme',d?'dark':'light');var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',d?'#161412':'#f4f1ea');})();</script>
    <title>护肤计划</title>
    <link rel="icon" href="icon-192.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="apple-mobile-web-app-title" content="护肤计划">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- 字体全部自托管(fonts/,SW 预缓存,离线可用) -->
    <link rel="preload" href="fonts/noto-serif-sc-400-skin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/screens/tonight.css">
    <link rel="stylesheet" href="css/screens/advisor.css">
    <link rel="stylesheet" href="css/screens/record.css">
    <link rel="stylesheet" href="css/screens/products.css">
    <!-- Firebase SDK(compat v9,全局 firebase);加载不到(离线 / 被墙)就只用本机数据 -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- App:原生 ES modules,无构建步骤。js/app.js 先拿「本设备只开一个窗口」的锁,拿到了才碰记录 -->
    <script type="module" src="js/app.js"></script>
</head>
<!-- 外壳只有挂载点;每一屏由 js/ui/*.js 渲染。结构见 ARCHITECTURE.md -->
<body>
    <div class="wrap">
        <header class="hdr">
            <span class="eyebrow" id="hdr-date"></span>
            <span class="net" id="net-badge" hidden>离线 · 改动先存在本机</span>
            <button type="button" class="seal" id="btn-settings" aria-label="设置"><span id="seal-ch" aria-hidden="true">我</span></button>
        </header>
        <div id="sync-toast-el" class="toast" role="status" aria-live="polite"></div>
        <main>
            <section id="tonight" class="panel active" role="tabpanel" aria-labelledby="tab-tonight"></section>
            <section id="advisor" class="panel" role="tabpanel" aria-labelledby="tab-advisor"></section>
            <section id="record" class="panel" role="tabpanel" aria-labelledby="tab-record"></section>
            <section id="products" class="panel" role="tabpanel" aria-labelledby="tab-products"></section>
        </main>
    </div>
    <nav class="tabbar" aria-label="主导航"><div class="tabbar-in" role="tablist">
        <button type="button" class="tab" id="tab-tonight" data-tab="tonight" role="tab" aria-selected="true" aria-controls="tonight">今晚</button>
        <button type="button" class="tab" id="tab-advisor" data-tab="advisor" role="tab" aria-selected="false" aria-controls="advisor">顾问</button>
        <button type="button" class="tab rec-tab" id="tab-record" data-tab="record" role="tab" aria-selected="false" aria-controls="record">记录</button>
        <button type="button" class="tab" id="tab-products" data-tab="products" role="tab" aria-selected="false" aria-controls="products">产品</button>
    </div></nav>
    <div id="sheet-root"></div>
    <noscript><p class="wrap note">护肤计划需要打开 JavaScript。</p></noscript>
</body>
</html>
