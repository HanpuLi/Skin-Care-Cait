name: QA 体检

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: 语法检查（内联脚本逐个编译）
        run: |
          node -e '
          const fs = require("fs");
          const h = fs.readFileSync("index.html", "utf8");
          const re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g;
          let m, n = 0, e = 0;
          while ((m = re.exec(h))) {
            n++;
            try { new Function(m[1]); }
            catch (err) { e++; console.error("SYNTAX ERROR in inline script #" + n + ": " + err.message); }
          }
          console.log("内联脚本 " + n + " 个，语法错误 " + e);
          process.exit(e > 0 ? 1 : 0);
          '

      - name: 关键功能存在性（防止误删）
        run: |
          node -e '
          const fs = require("fs");
          const h = fs.readFileSync("index.html", "utf8");
          const need = [
            "function buildNightSteps", "function renderTn", "function renderAm",
            "function assessSkin", "const AXES", "function renderAssessment",
            "const PLAN_TEMPLATES", "function applyPlanTemplate",
            "const PHASES", "function updatePhase", "function goalProgress",
            "const ONBOARD_SKIN", "function finishOnboarding",
            "const CLOUD_KEYS", "function clearLocalUserData", "function assignRoles"
          ];
          const miss = need.filter(s => !h.includes(s));
          if (miss.length) { console.error("缺失关键代码: " + miss.join(", ")); process.exit(1); }
          console.log("关键功能齐全，共 " + need.length + " 项 ✓");
          '

      - name: 配套文件与公开边界检查
        run: |
          node -e '
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          JSON.parse(fs.readFileSync("firebase.json", "utf8"));
          if (manifest.start_url !== "./index.html") throw new Error("manifest.start_url 必须指向 ./index.html");
          if (!fs.readFileSync("sw.js", "utf8").includes("skincare-app-v")) throw new Error("sw.js 缓存版本缺失");
          if (!fs.readFileSync("护肤计划.html", "utf8").includes("location.replace(")) throw new Error("旧 URL 重定向缺失");
          for (const f of ["README.md", "PRIVACY.md", "SECURITY.md"]) {
            if (!fs.existsSync(f)) throw new Error("缺少公开边界文档: " + f);
          }
          console.log("manifest/firebase/sw/redirect/public-docs ✓");
          '
          test -z "$(git ls-files AGENTS.md CLAUDE.md LIVING_TODO.md '家中护肤品清单.md' '审计报告_*.json')"

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install rule-test dependencies
        run: npm ci
      - name: Firestore rules access-control tests
        run: npm run test:rules
