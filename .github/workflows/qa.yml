name: QA 体检

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: 语法检查（内联脚本逐个编译）
        run: |
          node -e '
          const fs = require("fs");
          const h = fs.readFileSync("index.html", "utf8");
          const re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g;
          let m, n = 0, e = 0;
          while ((m = re.exec(h))) {
            n++;
            try { new Function(m[1]); }
            catch (err) { e++; console.error("SYNTAX ERROR in inline script #" + n + ": " + err.message); }
          }
          console.log("内联脚本 " + n + " 个，语法错误 " + e);
          process.exit(e > 0 ? 1 : 0);
          '

      - name: 关键功能存在性（防止误删）
        run: |
          node -e '
          const fs = require("fs");
          const h = fs.readFileSync("index.html", "utf8");
          const need = [
            "function buildNightSteps", "function renderTn", "function renderAm",
            "function assessSkin", "const AXES", "function renderAssessment",
            "const PHASES", "function currentPhase",
            "function safetyGate", "function gateBlocks", "function acidLadder", "function traitsOf",
            "function medicalRedLine", "function renderSafetyAlert", "function absorbPrescribedHistory",
            "function regimenRules", "function commitAiRegimen", "function undoRegimen", "function renderChangeBar",
            "function startOOBE", "function oobeFinish", "function openSheet", "function stripEmoji",
            "const CLOUD_KEYS", "function clearLocalUserData", "function assignRoles",
            "_applyingCloud", "hasPendingWrites", "function flushPendingPush"
          ];
          const miss = need.filter(s => !h.includes(s));
          if (miss.length) { console.error("缺失关键代码: " + miss.join(", ")); process.exit(1); }
          console.log("关键功能齐全，共 " + need.length + " 项");
          '

      - name: 配套文件与公开边界检查
        run: |
          node -e '
          const fs = require("fs");
          JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          JSON.parse(fs.readFileSync("firebase.json", "utf8"));
          const sw = fs.readFileSync("sw.js", "utf8");
          if (!sw.includes("skincare-app-v")) throw new Error("sw.js 缓存版本缺失");
          if (!sw.includes("./ai.js")) throw new Error("sw.js 没缓存 ai.js");
          // 自托管字体:三套都要在预缓存清单里、文件真的在(离线也是宋体)
          for (const f of ["fonts/noto-serif-sc-400-skin.woff2", "fonts/eb-garamond-latin-400.woff2", "fonts/courier-prime-latin-400.woff2"]) {
            if (!sw.includes("./" + f)) throw new Error("sw.js 没预缓存 " + f);
            if (!fs.existsSync(f)) throw new Error("缺字体文件 " + f);
          }
          if (!fs.existsSync("fonts/LICENSES.txt")) throw new Error("缺 fonts/LICENSES.txt(OFL)");
          for (const i of JSON.parse(fs.readFileSync("manifest.json", "utf8")).icons) if (!fs.existsSync(i.src)) throw new Error("manifest 图标缺文件 " + i.src);
          // 全程不用 emoji(Cait 2026-10-29):App 源码里一个都不留
          for (const f of ["index.html", "ai.js", "sw.js", "manifest.json"]) {
            const hit = fs.readFileSync(f, "utf8").match(/\p{Extended_Pictographic}/u);
            if (hit) throw new Error(f + " 里有 emoji: " + hit[0]);
          }
          const ai = fs.readFileSync("ai.js", "utf8");
          new Function(ai);
          const hooks = ["function renderCoach", "function aiRenderTonight", "function aiRegimenActionsHtml", "function aiOnAuth", "function aiClearLocal", "function aiAfterCheckin", "function buildSkincareContext"];
          const missAi = hooks.filter(s => !ai.includes(s));
          if (missAi.length) throw new Error("ai.js 缺: " + missAi.join(", "));
          if (/test:[A-Za-z0-9_-]{8,}/.test(ai)) throw new Error("ai.js 里不能写死测试 token");
          console.log("manifest/firebase/sw/fonts/ai.js ok");
          '
          test -z "$(git ls-files AGENTS.md CLAUDE.md LIVING_TODO.md '家中护肤品清单.md' '审计报告_*.json')"
